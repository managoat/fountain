# The team dashboards, wrapped as ConfigMaps for Grafana's sidecar.
#
# kube-prometheus-stack runs a sidecar that watches every namespace for
# ConfigMaps labelled `grafana_dashboard: "1"` and drops their contents into
# Grafana's provisioning directory. So a dashboard ships with the app, in the
# app's own namespace, and no Grafana state is edited by hand.
#
# Not referenced from ../k8s/kustomization.yaml (the baseline), because the portable
# baseline must not assume a Grafana exists, let alone one running that
# sidecar. An operator who has the sidecar adds this directory to their
# overlay, and one who does not imports
# the JSON by hand, which is what docs/guides/operate/observability.md
# describes.
#
# The generator root has to be this directory: kustomize refuses to load
# generator files from above its own root, so `files: ../grafana/*.json` from
# another directory would fail the build rather than reach across.
#
# fountain-dashboard.json is deliberately NOT here. It is the starter, built
# for a self-hoster with an empty Grafana and documented as an import; the ops
# dashboard supersedes it for a cluster that runs this overlay, and shipping
# both would put two near-identical dashboards in the same folder.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fountain

configMapGenerator:
  - name: fountain-grafana-ops
    files:
      - fountain-ops.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
  - name: fountain-grafana-product
    files:
      - fountain-product.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
