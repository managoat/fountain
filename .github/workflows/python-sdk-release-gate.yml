name: Python SDK release gate

# A shipped Python SDK change needs a new version before it reaches main. Test
# changes alone do not. The first release has no base version and passes.

on:
  pull_request:
    # `labeled`/`unlabeled` for the escape hatch below, which reads labels off
    # the event payload: without them, adding the label does nothing to the run
    # that wants it. The TypeScript and Elixir gates have both since they were
    # written; this one did not, so a metadata-only change here could only be
    # landed by cutting a release nobody asked for.
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "sdk/python/**"
      - ".github/workflows/python-sdk-release-gate.yml"
      - "scripts/sdk-release.py"
      - "scripts/sdk-catalog.py"

permissions:
  contents: read

jobs:
  gate:
    name: A shipped change has a releasable version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The deliberate exception, same as the other two gates: changing the
    # published surface without cutting a release. It should take a label and
    # a sentence in the PR.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'release:skip-sdk') && !contains(github.event.pull_request.labels.*.name, 'sdk-no-release') }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Check the version and changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/sdk-release.py python "origin/$BASE_REF" --check-registry
