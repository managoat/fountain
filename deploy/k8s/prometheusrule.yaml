# Generic alerts for a self-hosted Managoat — the operational knowledge from
# running the hosted instance, with the hosted-specific routing and thresholds
# removed.
#
# Off by default: this file is commented out of kustomization.yaml, because it
# needs the PrometheusRule CRD (prometheus-operator / kube-prometheus-stack).
# To enable: make sure your Prometheus scrapes the app's metrics port (9568 —
# this baseline ships no ServiceMonitor, so wire the scrape however your stack
# does it), check the label matchers below against how your scrape names
# things, then uncomment the file in kustomization.yaml and re-apply.
#
# What is deliberately NOT here: node pressure, PVC fill, pod crash-looping,
# replica mismatch — kube-prometheus-stack ships all of those; duplicating
# them just doubles the paging.
#
# Every alert says what it means and what to do. The symptom → component map
# is https://managoat.com/docs/architecture and the actions
# are https://managoat.com/docs/troubleshooting.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: fountain-alerts
  labels:
    app: fountain
spec:
  groups:
    # ── Backups ───────────────────────────────────────────────────────────
    #
    # These watch the optional backup-cronjob.yaml and are inert until it
    # exists: each expression is gated on kube-state-metrics seeing the
    # CronJob, so enabling alerts without enabling backups does not page you
    # about backups you chose not to take.
    - name: fountain-backups
      interval: 60s
      rules:
        - alert: ManagoatBackupStale
          # last_successful_time is seconds-since-epoch of the last successful
          # run. 36h allows one missed nightly plus the startingDeadline
          # window before shouting.
          expr: |
            time() - kube_cronjob_status_last_successful_time{
              namespace="fountain", cronjob="fountain-pg-backup"
            } > 36 * 3600
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Managoat Postgres backup has not succeeded in over 36h"
            description: |
              The newest restorable dump is at least {{ $value | humanizeDuration }}
              old; recovery would lose everything since.
              Check: kubectl get jobs -n fountain --sort-by=.metadata.creationTimestamp | tail
              Logs:  kubectl logs -n fountain job/<name> -c dump
                     kubectl logs -n fountain job/<name> -c upload

        # The staleness alert cannot fire if the CronJob has never succeeded
        # even once — the metric is simply absent. Gated on the CronJob
        # existing so it stays silent when backups are not enabled at all.
        - alert: ManagoatBackupNeverSucceeded
          expr: |
            absent(kube_cronjob_status_last_successful_time{
              namespace="fountain", cronjob="fountain-pg-backup"
            })
              and on()
            count(kube_cronjob_info{namespace="fountain", cronjob="fountain-pg-backup"}) > 0
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "Managoat Postgres backup has never completed successfully"
            description: |
              The backup CronJob exists but no successful run has ever been
              recorded. Either it was just created, or every run has failed.
              Either way there is no verified backup yet.

        - alert: ManagoatBackupJobFailing
          expr: |
            kube_job_status_failed{namespace="fountain", job_name=~"fountain-pg-backup.*"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "A Managoat backup job failed"
            description: |
              {{ $labels.job_name }} has a failed pod; the nightly dump may not
              have been uploaded. One failure is not yet data loss —
              ManagoatBackupStale escalates if it keeps happening.

        - alert: ManagoatBackupSuspended
          expr: kube_cronjob_spec_suspend{namespace="fountain", cronjob="fountain-pg-backup"} == 1
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Managoat backup CronJob is suspended"
            description: |
              No backups are being taken. Fine during maintenance, dangerous
              if forgotten.

    # ── Application health ────────────────────────────────────────────────
    - name: fountain-app
      interval: 30s
      rules:
        - alert: ManagoatMetricsTargetDown
          # The metrics listener is a separate socket inside the same BEAM, so
          # a scrape failure while the pod still looks Ready means the VM
          # itself is in trouble — this doubles as the "up but wedged" canary.
          # NOTE: `job` here is whatever your scrape config named the target;
          # adjust the matcher to yours.
          expr: up{namespace="fountain"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Managoat metrics endpoint is not scrapeable"
            description: |
              Prometheus cannot scrape {{ $labels.pod }} on the metrics port.
              The pod may pass its readiness probe while the BEAM cannot serve.

        - alert: ManagoatHighServerErrorRate
          # 5xx as a share of all responses; 5% sustained for 10m is a real
          # regression, a single blip is not.
          expr: |
            sum(rate(phoenix_router_dispatch_stop_count{namespace="fountain", status=~"5.."}[5m]))
              /
            sum(rate(phoenix_router_dispatch_stop_count{namespace="fountain"}[5m]))
              > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Over 5% of Managoat responses are 5xx"
            description: |
              {{ $value | humanizePercentage }} of responses are server errors.
              Detail is in Sentry if you configured it, otherwise the pod logs.

        - alert: ManagoatUnhandledExceptions
          expr: |
            sum(rate(phoenix_router_dispatch_exception_count{namespace="fountain"}[5m])) > 0.1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Managoat is raising unhandled exceptions"
            description: |
              Exceptions escaping the router on {{ $labels.route }}. Stack
              traces are in Sentry if configured, otherwise only the logs.

        - alert: ManagoatDatabasePoolSaturated
          # queue_time is time waiting for a pool connection. It climbs when
          # every connection is checked out — the failure that presents as
          # "everything got slow" rather than "one query got slow".
          expr: |
            histogram_quantile(0.95,
              sum(rate(fountain_repo_query_queue_time_bucket{namespace="fountain"}[5m])) by (le)
            ) > 100
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Managoat is waiting on the database connection pool"
            description: |
              p95 wait for a connection is {{ $value | humanize }}ms. The pool
              is POOL_SIZE per replica (default 10). Sustained waits are slow
              queries holding connections, or genuine saturation — raise
              POOL_SIZE only after ruling out the former.

    # ── Sandboxes ─────────────────────────────────────────────────────────
    - name: fountain-sandboxes
      interval: 60s
      rules:
        - alert: ManagoatProvisionFailures
          # Provision calls already retry transient Sprites errors with
          # backoff, so anything counted here failed after retries — users
          # are seeing conversations that fail to start. Counts the "failed"
          # stage events the server publishes; failures are rescued inside
          # the GenServer, so no exception metric ever sees them (#310).
          # Absolute count over 30m rather than a rate: a small instance
          # never sustains enough traffic for a per-second threshold.
          expr: |
            sum(increase(fountain_stage_count{namespace="fountain", stage="provision", status="failed"}[30m])) > 2
          labels:
            severity: warning
          annotations:
            summary: "Managoat sandbox provisioning is failing"
            description: |
              Likely causes, in the order to check them: SPRITES_TOKEN invalid
              or rate-limited, the Sprites API unhealthy, or tenants at their
              concurrency cap. Triage:
              https://managoat.com/docs/troubleshooting/sandbox-errors

        - alert: ManagoatStageFailures
          # Keep provisioning's existing sensitivity; cover later setup stages.
          expr: |
            sum by (stage) (increase(fountain_stage_count{namespace="fountain", stage!="provision", status="failed"}[30m])) > 2
          labels:
            severity: warning
          annotations:
            summary: "Managoat conversation stages are failing"
            description: "Stage {{ $labels.stage }} failed more than twice in 30 minutes. Inspect conversation stages and provider health."

        - alert: ManagoatBrokerCAInstallFailureRate
          # Actual conversation trust setup only: proxy requests and health
          # probes never emit this metric. Five attempts suppress idle noise.
          expr: |
            (
              round(
                sum by (provider) (increase(fountain_broker_ca_install_count{namespace="fountain", outcome="exit"}[1h]))
                / sum by (provider) (increase(fountain_broker_ca_install_count{namespace="fountain"}[1h])),
                0.000001
              ) > 0.10
            )
            and
            sum by (provider) (increase(fountain_broker_ca_install_count{namespace="fountain"}[1h])) >= 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: 'Broker CA installation failures exceed 10% for {{ $labels.provider }}'
            description: 'More than 10% of at least five conversation CA setup attempts failed with a nonzero installer exit over the last hour. Inspect broker stage failures and sandbox provider/base-image changes.'

        - alert: ManagoatTurnFailureRate
          # Histogram counts are events, so sum across replicas. Require ten
          # terminal turns per provider to avoid paging on one failed attempt.
          # Zero-fill missing failure series with the SAME provider labels.
          # Round the ratio to avoid floating-point noise paging at exactly 25%.
          expr: |
            (
              round((
                sum by (provider) (increase(fountain_turn_completed_duration_ms_count{namespace="fountain", status="failed"}[30m]))
                or
                0 * sum by (provider) (increase(fountain_turn_completed_duration_ms_count{namespace="fountain"}[30m]))
              )
              / sum by (provider) (increase(fountain_turn_completed_duration_ms_count{namespace="fountain"}[30m])), 0.000001)
              > 0.25
            )
            and on (provider)
            sum by (provider) (increase(fountain_turn_completed_duration_ms_count{namespace="fountain"}[30m])) >= 10
          labels:
            severity: warning
          annotations:
            summary: "Managoat turn failures exceed 25% for a provider"
            description: "More than a quarter of at least ten terminal turns failed on {{ $labels.provider }} in 30 minutes. Inspect failed conversations and provider status."

        - alert: ManagoatReattachFailures
          # Reattach's duration histogram has no outcome label. The stage
          # counter records failures even when the operation rescues them.
          expr: |
            sum(increase(fountain_stage_count{namespace="fountain", stage="reattach", status="failed"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Managoat could not reattach a conversation"
            description: "A reattach failed in the last hour. Inspect the conversation and sandbox before any manual cleanup."

        - alert: ManagoatTurnFirstOutputSlow
          # First-output samples exist only when output arrives: this detects
          # slow observed output, not a turn that never emits any bytes.
          expr: |
            histogram_quantile(0.95,
              sum by (provider, le) (rate(fountain_turn_first_output_elapsed_ms_bucket{namespace="fountain"}[30m]))
            ) > 30000
            and on (provider)
            sum by (provider) (increase(fountain_turn_first_output_elapsed_ms_count{namespace="fountain"}[30m])) >= 10
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Managoat first output is slow for a provider"
            description: "Observed first-output p95 exceeds 30 seconds on {{ $labels.provider }} for 15 minutes, with at least ten samples per 30-minute window. Inspect runtime startup and provider latency."

        - alert: ManagoatProvisionDeadlineExceeded
          # The provision watchdog (#329) declared a provision wedged and
          # force-failed it. The accompanying sprite destroy is best-effort
          # (#394), so each firing may also leak a sprite that keeps billing
          # your SPRITES_TOKEN — a cost signal as much as a UX one. Absolute
          # count, not a rate: the event is rare by design.
          expr: |
            sum(increase(fountain_provision_deadline_exceeded_count{namespace="fountain"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "A Managoat provision hit the watchdog deadline"
            description: |
              {{ $value }} provision(s) in the last hour ran past the watchdog
              deadline and were force-failed. Each may have leaked a sprite —
              check whether the reaper's untracked count rises on its next
              run, and grep the app logs for "provisioning exceeded".

        - alert: ManagoatSandboxBudgetExceeded
          # OpsGauges polls the same database on each replica. Deduplicate
          # each status before adding them; event counters still need sum.
          # Instance-wide concurrency ceiling (#405). Every sprite bills to
          # your single SPRITES_TOKEN and the only enforced cap is per-tenant
          # (default 5), so total concurrent spend is otherwise
          # `users x cap` with no ceiling. 50 is a starter budget — an
          # operator knob, not a law: size it to what you are willing to pay
          # for.
          expr: |
            sum(max by (namespace, status) (fountain_sandboxes_count{namespace="fountain", status=~"pending|starting|ready"})) > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Managoat sandbox concurrency is above the instance budget"
            description: |
              {{ $value }} sandboxes are pending/starting/ready, all billing
              your SPRITES_TOKEN. Find who is driving it (psql into your
              database):
              select user_id, count(*) from sandboxes
                where status in ('pending','starting','ready')
                group by 1 order by 2 desc limit 10;

        - alert: ManagoatConversationsAboveBudget
          # Companion to the sandbox budget, on the conversation gauge: a
          # pending/running conversation implies a live sprite, so in steady
          # state the two track each other. This one still fires when the
          # sandbox rows are wrong — the drift SandboxReaper measures — and
          # shares the same 50 knob.
          expr: |
            sum(max by (namespace, status) (fountain_conversations_count{namespace="fountain", status=~"pending|running"})) > 50
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Managoat has more live conversations than the instance budget"
            description: |
              {{ $value }} conversations are pending/running against a budget
              of 50. If ManagoatSandboxBudgetExceeded is not also firing, the
              sandbox rows and reality have diverged — check the reaper log
              line for released/expired/untracked counts.

    # ── Sprite reaper (#405) ──────────────────────────────────────────────
    #
    # SandboxReaper reconciles the sandboxes table against the Sprites API
    # hourly. Its third pass counts sprites running with no sandbox row and
    # deliberately never destroys them — so its output is a gauge someone
    # must be looking at, plus these alerts.
    - name: fountain-reaper
      interval: 60s
      rules:
        - alert: ManagoatUntrackedSprites
          # The LEVEL of sprites alive with no live sandbox row, re-measured
          # every run. Sustained non-zero is leaked money, not an outage —
          # hence warning. 2h means two consecutive hourly runs both saw
          # leaks, filtering legitimate transients (a sprite created seconds
          # before the sweep, a developer using the shared token).
          expr: fountain_reaper_untracked_count{namespace="fountain"} > 0
          for: 2h
          labels:
            severity: warning
          annotations:
            summary: "Sprites are running with no sandbox row (leaked spend)"
            description: |
              {{ $value }} sprite(s) have been running with no live sandbox
              row for over 2h, billing your SPRITES_TOKEN. The reaper
              deliberately never destroys these — a human has to look. The
              run log includes a sample of the sprite names: grep the app
              logs for "no sandbox row".

        - alert: ManagoatReaperSilent
          # The wedged-reaper canary. fountain_reaper_run_released is emitted
          # at the end of every hourly run; absent() for 3h means no run has
          # completed since boot. A reaper that runs and raises is caught by
          # the Oban alerts below instead. An increase()-based staleness
          # check cannot work here: the counter is legitimately flat for
          # weeks when healthy.
          expr: absent(fountain_reaper_run_released{namespace="fountain"})
          for: 3h
          labels:
            severity: warning
          annotations:
            summary: "SandboxReaper has not completed a run since boot"
            description: |
              No SandboxReaper run has finished on this pod (it runs hourly).
              Stuck rows are holding tenant quota and dead sprites are not
              being destroyed. Inspect the job (psql into your database):
              select id, state, attempt, errors[array_upper(errors,1)]
                from oban_jobs where worker like '%SandboxReaper%'
                order by id desc limit 5;

    # ── Oban background jobs ──────────────────────────────────────────────
    #
    # Oban catches job exceptions internally and reports them only via
    # telemetry — no process crashes, so no crash report ever sees a failing
    # nightly RetentionPruner or hourly SandboxReaper. These watch the
    # metrics the app exports from Oban's own events.
    - name: fountain-oban
      interval: 60s
      rules:
        - alert: ManagoatObanJobsRaising
          # Every raising execution counts, including retries — the early
          # signal, while Oban is still retrying and the job might yet
          # succeed.
          expr: |
            sum by (queue, worker) (increase(fountain_oban_job_exception_count{namespace="fountain"}[1h])) > 0
          labels:
            severity: warning
          annotations:
            summary: "Oban jobs are raising in {{ $labels.queue }} ({{ $labels.worker }})"
            description: |
              {{ $value }} raising execution(s) in the last hour. Oban retries
              with backoff, so this may self-heal — but a persistently raising
              maintenance job means reaping/pruning/metering is not happening.
              Check the job row's errors array (psql into your database):
              select id, worker, state, attempt, errors[array_upper(errors,1)]
                from oban_jobs order by id desc limit 5;

        - alert: ManagoatObanJobsDiscarded
          # A discarded job exhausted every retry and failed permanently.
          # delta on the gauge rather than a static > 0: discarded rows sit
          # for 7 days until Oban's pruner removes them, and an alert that
          # stays red for a week trains people to ignore it.
          expr: |
            delta((max by (namespace, queue, state) (fountain_oban_queue_depth{namespace="fountain", state="discarded"}))[2h:1m]) > 0
          labels:
            severity: critical
          annotations:
            summary: "An Oban job in {{ $labels.queue }} was discarded (all retries exhausted)"
            description: |
              The scheduled work this job represents did not happen — for the
              maintenance queue that means reaping, retention or metering
              silently stopped. Inspect and re-run (psql into your database):
              select id, worker, errors[array_upper(errors,1)]
                from oban_jobs where state='discarded' order by id desc limit 5;

        - alert: ManagoatObanQueueBacklog
          # available = runnable now but not picked up. A sustained backlog
          # means concurrency is saturated or a worker is wedged.
          expr: |
            max by (namespace, queue, state) (fountain_oban_queue_depth{namespace="fountain", state="available"}) > 25
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "Oban queue {{ $labels.queue }} has a sustained backlog"
            description: |
              {{ $value }} jobs runnable-but-waiting for 30m. Check whether
              the queue's workers are wedged (executing depth pinned at its
              concurrency limit) or something is enqueueing faster than the
              queue drains.
