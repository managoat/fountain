# The site's paths of managoat.com, carved out of the app's host rule.
#
# The app's IngressRoute (home-cloud, platform/fountain-site) matches the bare
# Host(); this one matches Host() plus a path list, and Traefik ranks rules by
# length, so every path named here lands on the site and everything else --
# /auth, /dashboard, /api (its /api/docs Swagger included), /terms, /privacy,
# /help -- stays with the app. The list is the page table in
# site/lib/site/build.ex, /site/ for the assets, and the manual: /docs and
# everything under it, and its llms.txt files and skill (decisions/0081). The
# app redirects those paths to DOCS_URL, https://managoat.com by default, so
# on this host they must never reach it. test/site_test.exs holds the list and
# the build together.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: managoat-site
  namespace: managoat-site
  labels:
    app: managoat-site
spec:
  entryPoints:
    - websecure
  routes:
    # Each page twice, with and without a trailing slash: Path() is exact, and
    # nginx sends the slashed form to the clean URL, so both must land here.
    - match: >-
        Host(`managoat.com`) && (Path(`/`) ||
        Path(`/built-with`) || Path(`/built-with/`) ||
        Path(`/docs`) || PathPrefix(`/docs/`) ||
        Path(`/llms.txt`) || Path(`/llms-full.txt`) ||
        Path(`/skill`) || Path(`/skills/managoat/SKILL.md`) ||
        Path(`/skills/fountain/SKILL.md`) ||
        PathPrefix(`/site/`))
      kind: Rule
      services:
        - name: managoat-site
          port: 80
  tls:
    secretName: managoat-site-tls
