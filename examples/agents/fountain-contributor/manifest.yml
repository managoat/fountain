# A Managoat agent that contributes to Managoat itself, configured to do what
# a maintainer's laptop session does: the pinned toolchain, a database, the
# component checks, and one pull request at the end.
#
# Apply it, then start a conversation with your own vault attached:
#
#   managoat apply -f examples/agents/fountain-contributor/manifest.yml
#   managoat run fountain-contributor --vault fountain-contributor-me \
#     -p "Fix issue #NNN"
#
# Read the README next to this file before the first apply — the vault below
# needs your credentials and a sandbox supported by mise precompiled Erlang.
apiVersion: managoat/v1
kind: Environment
metadata:
  name: fountain-contributor
spec:
  networking_type: unrestricted
  setup_timeout_seconds: 900
  packages:
    apt:
      - build-essential
      - libncurses-dev
      - libssl-dev
      - unzip
      - jq
      - ripgrep
      - postgresql
      - postgresql-contrib
      - python3
  env_vars:
    LANG: C.UTF-8
    MISE_ERLANG_COMPILE: "false"
  repositories:
    - url: https://github.com/managoat/managoat
      mount_path: /workspace/fountain
      secret_key: GITHUB_TOKEN
  setup_script: |
    set -euo pipefail

    # Postgres: apt installs a cluster but starts nothing in a sandbox, and
    # the image's Debian release picks the major version — ask, don't assume.
    PG_MAJOR=$(find /etc/postgresql -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -n | tail -1)
    sudo pg_ctlcluster "$PG_MAJOR" main start
    sudo -u postgres psql -c "ALTER ROLE postgres WITH LOGIN SUPERUSER PASSWORD 'postgres'"

    # gh, for the pull request at the end of the job.
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
      | sudo tee /etc/apt/sources.list.d/github-cli.list
    sudo apt-get update -qq && sudo apt-get install -y -qq gh

    # Install binary toolchains using the checkout pins. Fail if no compatible
    # Erlang binary exists; never fall back to a source build.
    curl -fsSL https://mise.run | sh
    export PATH="$HOME/.local/bin:$PATH"
    # Expand when the next shell starts.
    # shellcheck disable=SC2016
    echo 'eval "$(~/.local/bin/mise activate bash)"' >> ~/.bashrc
    cd /workspace/fountain
    mise settings set erlang.compile false
    mise install
    GO_VERSION=$(awk '$1 == "go" {print $2}' cli/go.mod)
    mise use -g "go@$GO_VERSION"
    eval "$(mise env -s bash)"

    # Dependency compilation, database setup and Dialyzer belong to the task,
    # not every conversation. Read CONTRIBUTING.md before choosing checks.

---
# Your per-person overlay. Attach it at launch (`--vault`); its values win
# over the environment's on key collision, and — measured on every provider —
# over the platform's own defaults, which is what makes the git identity
# below effective.
apiVersion: managoat/v1
kind: Vault
metadata:
  name: fountain-contributor-me
spec:
  secrets:
    # Clones the repo, authenticates gh, opens the pull request. `${VAR}`
    # substitutes from your environment or from `--var` at apply time; a
    # secret-manager ref like `op://Private/github/token` resolves through
    # the 1Password CLI instead, if you keep it there — see the README.
    GITHUB_TOKEN: ${GITHUB_TOKEN}
    GH_TOKEN: ${GITHUB_TOKEN}
    # Not secret, but the vault is the only per-person overlay we have, and
    # these must override the platform default (`AoD <aod@local>`) so
    # commits carry a person's name.
    GIT_AUTHOR_NAME: ${GIT_NAME}
    GIT_AUTHOR_EMAIL: ${GIT_EMAIL}
    GIT_COMMITTER_NAME: ${GIT_NAME}
    GIT_COMMITTER_EMAIL: ${GIT_EMAIL}
---
apiVersion: managoat/v1
kind: Agent
metadata:
  name: fountain-contributor
spec:
  runtime: claude
  model: anthropic/claude-opus-5
  environment: fountain-contributor
  description: >
    Works on managoat/managoat the way a maintainer does: reads CLAUDE.md
    and the relevant guides first, runs component checks, opens one pull request.
  system: |
    You contribute to Managoat. The checkout is at /workspace/fountain, and it
    is not your working directory, so nothing in it has been loaded for you.

    Before you touch anything:
      1. cd /workspace/fountain and inspect git status and the current branch.
         Fetch origin. For a new task, create a new branch from origin/main
         only if the checkout is clean. On follow-up turns preserve existing
         work and continue the task branch; never reset it or discard changes.
      2. Read CLAUDE.md and CONTRIBUTING.md from the current checkout, then
         the guides they link for the component you are changing.
      3. Read decisions/index.md when the change is architectural.

    Use the pinned toolchain via mise exec for every mix command. Toolchains
    must use precompiled releases; never build Erlang from source or disable
    MISE_ERLANG_COMPILE=false. If no compatible binary exists, report the
    platform and pin that failed. Use published CLI/tool binaries when needed.

    Provision only what the task needs. For server work, install Hex/Rebar,
    fetch dependencies and set up dev and test databases per SETUP.md. Leave
    DATABASE_URL unset for the repository's separate dev/test defaults; never
    run the test suite against the dev database. Compile project code and
    dependencies as needed for the change. Install docs/ADR tools only when
    required, using published binaries.

    Before pushing, run the checks for the changed components from
    CONTRIBUTING.md, including focused tests. Documentation changes follow
    contributing/docs.md. mix precommit does not run the suite by default.
    Run checks in the foreground and inspect their exit status and output;
    use pipefail when piping output through tee. Do not claim success for
    pending, skipped or failed checks.

    Never push to main. Open one pull request describing the change and
    validation. Follow CONTRIBUTING.md for landing when asked to land it.
    Report the PR link, pushed commit SHA, checks run and remaining blockers.
  permission_policy:
    default: auto_allow
  # `allowed_vault_ids` is deliberately absent: absent means any of your own
  # vaults may attach, an empty list would forbid attaching one at all — and
  # this agent needs the vault above. Tighten it to your vault's id after the
  # first apply if you want the allowlist.
