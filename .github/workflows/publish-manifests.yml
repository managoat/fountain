name: publish-manifests

# Publishes what Flux deploys: an OCI artifact at
# ghcr.io/managoat/fountain-manifests holding the exact tree that was
# built, plus the image tag built from it, pinned in deploy/k8s's `images:`.
# That pairing is the point. Flux once tracked `main`, where the two arrive
# in separate commits minutes apart — the PR changes a manifest, the image
# finishes building later, and the pin lands after that. Flux polls every
# 5 minutes, so it routinely applied a manifest against the previous image.
#
# The artifact is the product's deployable and nothing more: deploy/ as
# committed, with deploy/k8s/kustomization.yaml's `newTag` rewritten from the
# release pin to the sha tag built from this tree. Nothing in it is specific
# to any one cluster; the maintainer's own instance applies its private
# overlay on top with Flux `patches` from the home-cloud repo (decisions/0032),
# and anyone else's Flux could consume the same artifact the same way.
#
# That is not theoretical: #241 moved the readiness probe to a new path, Flux
# applied it against an image with no such route, and every pod 404'd its
# probe and never became ready. A derived, force-pushed `deploy` branch fixed
# that (#250); the artifact replaces the branch with the same guarantee and
# less git machinery (#304). This workflow pushes no git refs at all.
#
# Flow: push to main → build.yml builds and pushes
#   ghcr.io/managoat/fountain:sha-<sha>
#       → this workflow publishes the artifact from *that sha's tree* with
#         the matching tag pinned: immutable `sha-<short>` plus a moving
#         `latest`
#       → the cluster's OCIRepository reconciles `latest`.
#
# Manifest-only pushes (deploy/**) skip the build entirely and
# publish directly, pinning the newest ancestor image that exists — the tree
# changed nothing the image is built from, so "manifests paired with the
# image they were written against" still holds.
#
# Rollback is one command, no git involved:
#   flux tag artifact oci://ghcr.io/managoat/fountain-manifests:sha-<old> --tag latest
#
# `main` is never deployed directly. The committed `newTag` in deploy/k8s is
# the release pin self-hosters use; the artifact never carries it.

on:
  workflow_run:
    workflows: [build]
    types: [completed]
    branches: [main]
  # The manifest fast path: a push touching only the deployed manifests
  # publishes directly — no image build to wait for. The image pin resolves
  # to the newest *ancestor* commit whose image exists (see below), which is
  # exactly the image already running plus this manifest change. Without
  # this trigger a deploy-only push would never deploy at all: build.yml
  # skips deploy/**, and this workflow otherwise only fires when a build
  # completes.
  push:
    branches: [main]
    paths:
      - "deploy/**"
  # Manual escape hatch: republishes from a given commit's tree. The
  # ancestor-walk image resolution keeps it honest — a tree whose history
  # contains no built image is refused before anything is published.
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to publish (defaults to the branch tip)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  # Nothing deployed unvalidated (#414): before this job existed, the
  # manifest fast path pushed the live Deployment (and, back then, the CNPG
  # cluster and the PrometheusRule) straight to the artifact Flux reconciles,
  # with no check of any kind — a typo'd manifest was applied to prod by the
  # reconciler.
  validate:
    name: Validate the manifests
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      SRC_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.SRC_SHA }}

      - name: kustomize build + kubeconform (deploy/k8s/)
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=v0.7.0
          curl -sSfL \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar xz kubeconform

          for dir in deploy/k8s; do
            echo "── ${dir}"
            kubectl kustomize "${dir}" > "/tmp/${dir//\//-}.yaml"
            # The CRDs catalog covers PrometheusRule (the one CRD the
            # baseline ships, commented out of its kustomization); -strict
            # rejects unknown fields, which is the class of typo that
            # survives YAML parsing.
            ./kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              "/tmp/${dir//\//-}.yaml"
          done

      - name: promtool check rules (PrometheusRule alert expressions)
        run: |
          set -euo pipefail
          PROM_VERSION=3.5.0
          curl -sSfL \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz" \
            | tar xz --strip-components=1 "prometheus-${PROM_VERSION}.linux-amd64/promtool"

          # promtool reads a bare rules file; the PrometheusRule wraps the
          # groups under spec.groups.
          for f in deploy/k8s/prometheusrule.yaml; do
            echo "── ${f}"
            python3 -c "import yaml; yaml.safe_dump(yaml.safe_load(open('${f}'))['spec'], open('/tmp/rules.yaml', 'w'))"
            ./promtool check rules /tmp/rules.yaml
          done

  publish:
    name: Publish the manifest artifact
    needs: validate
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      # The commit that was actually built — NOT main's tip. Pinning onto
      # the tip is what let a newer manifest ride out with an older image.
      SRC_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
      MANIFESTS: ghcr.io/managoat/fountain-manifests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ env.SRC_SHA }}
          # Full history: the backwards-move guard below walks ancestry.
          fetch-depth: 0

      - name: Resolve image tag
        id: tag
        # The manifest tree is SRC_SHA's; the image pin is the newest
        # first-parent ancestor (SRC_SHA included) whose image actually
        # exists in the registry. After a build workflow_run that is SRC_SHA
        # itself — identical to the old behavior. After a manifest-only push
        # it is the image already running, which is the point: the pushed
        # tree changed nothing the image is built from. The walk doubles as
        # the existence guard — no image in the last 50 commits aborts.
        run: |
          set -euo pipefail
          image=""
          image_sha=""
          for candidate in $(git rev-list --first-parent -n 50 "${SRC_SHA}"); do
            if docker manifest inspect \
                 "ghcr.io/managoat/fountain:sha-${candidate}" > /dev/null 2>&1; then
              image="ghcr.io/managoat/fountain:sha-${candidate}"
              # The commit the IMAGE was built from, which is not always
              # SRC_SHA: on a manifest-only push this walk lands on an
              # ancestor. The pin must name what is running, not the tree
              # that triggered the publish.
              image_sha="${candidate}"
              break
            fi
          done

          if [ -z "${image}" ]; then
            echo "no built image found in the 50 commits behind ${SRC_SHA:0:7}; refusing to publish." >&2
            exit 1
          fi

          echo "manifest tree ${SRC_SHA:0:7} pins image ${image}"
          {
            echo "sha=${SRC_SHA}"
            echo "short=${SRC_SHA:0:7}"
            echo "image=${image}"
            echo "image_sha=${image_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Pin the image tag in the working tree
        env:
          IMAGE_SHA: ${{ steps.tag.outputs.image_sha }}
        run: |
          set -euo pipefail
          # The baseline's `images:` block pins a release for self-hosters;
          # the artifact pins the sha tag built from this tree instead. Only
          # the checkout is edited — nothing is committed — and the publish
          # fails unless exactly one newTag line was rewritten, so a stale
          # release pin can never ship silently.
          #
          # FOUNTAIN_BUILD_SHA is no longer pinned here: build.yml bakes it
          # into the image as BUILD_SHA, which names the same commit this
          # step resolved (the image's, not the deployed tree's).
          f=deploy/k8s/kustomization.yaml
          n=$(grep -cE '^\s*newTag:' "$f")
          [ "$n" = 1 ] || { echo "expected exactly one newTag in $f, found $n" >&2; exit 1; }
          sed -i -E "s|^(\s*newTag:).*|\1 sha-${IMAGE_SHA}|" "$f"
          grep -qE "^\s*newTag: sha-${IMAGE_SHA}$" "$f" || {
            echo "image pin substitution failed in $f" >&2
            exit 1
          }
          git diff --stat "$f"

      - name: Setup flux CLI
        uses: fluxcd/flux2/action@dd233c4fadef306a62b7893204f8e3817fecc2b2 # v2.9.5
        with:
          # Matches the cluster's source-controller. Nothing here is
          # version-sensitive, but drift is one more thing to reason about
          # during an incident.
          version: 2.8.7

      - name: Publish the manifest artifact
        env:
          SHA: ${{ steps.tag.outputs.sha }}
          SHORT: ${{ steps.tag.outputs.short }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          echo "$GITHUB_TOKEN" \
            | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Refuse to move `latest` backwards. Builds can finish out of order —
          # a slow build for an older commit must not overwrite a newer deploy
          # with stale manifests. The artifact's source sha lives in the
          # standard OCI revision annotation (set by --revision below), so this
          # needs no extra state. Absent annotation (first run) or an unknown
          # sha both fall through to publishing.
          previous=$(docker buildx imagetools inspect --raw "${MANIFESTS}:latest" 2>/dev/null \
            | jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true)

          if [ -n "${previous}" ] && [ "${previous}" != "${SHA}" ]; then
            if git merge-base --is-ancestor "${SHA}" "${previous}" 2>/dev/null; then
              echo "sha-${SHORT} is an ancestor of the published ${previous:0:7}; refusing to move latest backwards."
              exit 0
            fi
          fi

          # Stage what the cluster Kustomizations consume: all of deploy/,
          # relative layout intact (./deploy/k8s for the app, ./deploy/grafana
          # for the dashboards). All of deploy/ rather than a named list: the
          # named list once omitted deploy/grafana (#1001) and Flux sat at
          # BuildFailed, wedging every later deploy while the running
          # workload stayed healthy — the quiet kind of broken.
          staging=$(mktemp -d)
          cp -R deploy "${staging}/deploy"

          # Build what is about to be published, with the pin in it.
          echo "── verifying the staged tree builds"
          kubectl kustomize "${staging}/deploy/k8s" \
            | grep -q "image: ghcr.io/managoat/fountain:sha-" \
            || { echo "staged tree does not carry a sha pin" >&2; exit 1; }

          flux push artifact "oci://${MANIFESTS}:sha-${SHORT}" \
            --path="${staging}" \
            --source="https://github.com/${{ github.repository }}" \
            --revision="${SHA}"

          flux tag artifact "oci://${MANIFESTS}:sha-${SHORT}" --tag latest

          echo "manifest artifact published: ${MANIFESTS}:sha-${SHORT} (revision ${SHA}), latest re-tagged"

      - name: Nudge Flux
        # Tells the cluster's notification-controller the artifact moved, so
        # the OCIRepository reconciles now instead of on its next 5m poll
        # (the fountain-artifact-receiver in home-cloud platform/flux-webhooks/).
        # Strictly best-effort: a deploy must never fail because a webhook
        # did — the poll interval remains the fallback. The URL embeds the
        # receiver's token-derived path; it rotates with
        # github-webhook-token, so update this secret when that rotates.
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          if [ -z "${FLUX_WEBHOOK_URL}" ]; then
            echo "FLUX_WEBHOOK_URL not set; relying on the poll interval."
            exit 0
          fi

          if curl -fsS -m 10 -X POST "${FLUX_WEBHOOK_URL}" > /dev/null; then
            echo "flux nudged — reconcile requested"
          else
            echo "webhook ping failed; the 5m poll will pick it up"
          fi
