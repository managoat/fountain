# The smallest Managoat setup that proves an agent received a real checkout.
# It needs no repository credential because the Managoat repository is public.
apiVersion: managoat/v1
kind: Environment
metadata:
  name: fountain-quickstart
spec:
  repositories:
    - url: https://github.com/managoat/fountain
      mount_path: /workspace/fountain
---
apiVersion: managoat/v1
kind: Agent
metadata:
  name: fountain-reader
spec:
  runtime: claude
  model: anthropic/claude-sonnet-5
  environment: fountain-quickstart
  description: Reads a real repository in a Managoat sandbox
  system: |
    Work in /workspace/fountain. Inspect the repository before you answer.
    Do not edit files. Keep the answer short and name the source files that
    support it.
