# :8080 unprivileged; /healthz for the k8s probes.
#
# Pages are written as `<path>.html` (`/faq` -> faq.html, `/` ->
# index.html), so try_files serves a clean URL without a redirect. Anything
# else is a 404 from nginx, but on managoat.com nothing else reaches here:
# Traefik sends only the site's paths to this service and the rest to the app
# (home-cloud, platform/managoat-site).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects carry a path, not a host: nginx only knows its own :8080, and
    # the first deploy sent /case-studies to managoat.com:8080.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # One case study, so the index is a shortcut to it (Site.Build.redirects/0).
    location = /case-studies { return 301 /case-studies/self-healing-infrastructure; }
    location = /case-studies/ { return 301 /case-studies/self-healing-infrastructure; }

    # Stylesheets carry a content hash in the name; the images do not and get
    # the app's old four-hour window instead.
    # Quoted: nginx reads an unquoted `{8}` as a block boundary and refuses
    # to start, which took the whole site down in the local image smoke test.
    location ~ "^/site/.*\.[0-9a-f]{8}\.css$" { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /site/ { add_header Cache-Control "public, max-age=14400"; }

    # A trailing slash on a page is the same page; send it to the clean URL
    # rather than answering 404 (the app ignored trailing slashes too).
    location ~ ^/(.+)/$ { return 301 /$1; }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
