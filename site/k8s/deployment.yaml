apiVersion: apps/v1
kind: Deployment
metadata:
  name: managoat-site
  namespace: managoat-site
  labels:
    app: managoat-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: managoat-site
  template:
    metadata:
      labels:
        app: managoat-site
    spec:
      containers:
        - name: web
          # No tag here: kustomization.yaml's `images:` sets it, and the
          # artifact .github/workflows/site.yml publishes pins it to the sha
          # built from that commit (the shape of deploy/k8s).
          image: ghcr.io/managoat/site
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 128Mi }
