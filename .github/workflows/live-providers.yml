# The sandbox adapters against real provider accounts:
# apps/fountain/test/live/sandbox_*_live_test.exs, tagged :live, which
# `mix test` excludes. The stubbed suites (apps/fountain/test/managoat/sandbox)
# prove what an adapter sends; this proves what the provider does with it,
# which a stub cannot know (#2574: E2B 404s stdin by tag after a pause and
# resume, and every stubbed test passed).
#
# Moved here from managoat/managoat_sandbox's live.yml when that library was
# folded back into Fountain (decisions/0037, addendum of 2026-10-15).
#
# Scheduled and dispatched only, never on pull_request: it spends the
# accounts' money and their keys must not reach a fork's code. Sandboxes it
# creates carry the `msb-live-` name prefix; the suite destroys its own, and
# each job's last step destroys any a killed run left behind.
#
# A failed test is re-run once on its own. A provider's network blips (one
# envd start timing out in ~50 runs) would otherwise turn the job red often
# enough to be ignored; a real break fails twice. The re-run is a warning in
# the summary, never silent.
#
# Secrets: E2B_API_KEY (shared with live-adapters.yml) and SPRITES_TOKEN.
# Variables E2B_BASE_URL and E2B_TEMPLATE, as in live-adapters.yml.
name: Live providers

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-providers
  cancel-in-progress: false

env:
  MIX_ENV: test
  PG_IMAGE: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb

jobs:
  e2b:
    name: e2b
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      E2B_BASE_URL: ${{ vars.E2B_BASE_URL || 'https://api.e2b.app' }}
      # The template Fountain's production names, so a template that stopped
      # booting or lost the `sprite` user fails here too.
      E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE || 'fountain' }}

    steps:
      - name: Require the E2B key
        run: |
          if [ -z "${E2B_API_KEY}" ]; then
            echo "::error::E2B_API_KEY is not configured for this repository."
            exit 1
          fi

      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-live-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-live-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-live-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-live-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Postgres
        run: |
          set -uo pipefail
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          exit 1

      # The suite needs no rows, but the application it boots runs Oban,
      # which checks its migrations at start.
      - name: Set up database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Live E2B suite
        working-directory: apps/fountain
        timeout-minutes: 15
        run: |
          mix test --only live test/live/sandbox_e2b_live_test.exs && exit 0
          echo "::warning::E2B live tests failed once; re-running only those"
          mix test --only live --failed

      - name: Destroy leftover live sandboxes
        if: always()
        timeout-minutes: 2
        run: |
          curl -fsS -H "x-api-key: ${E2B_API_KEY}" \
            "${E2B_BASE_URL}/v2/sandboxes?state=running,paused&limit=100" |
            jq -r '.[] | select((.metadata.fountain_name // "") | startswith("msb-live-")) | .sandboxID' |
            while read -r id; do
              echo "destroying ${id}"
              curl -fsS -X DELETE -H "x-api-key: ${E2B_API_KEY}" "${E2B_BASE_URL}/sandboxes/${id}" || true
            done

  sprites:
    name: sprites
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # Sprites tokens cannot be scoped to a name prefix, so this is an
      # organization token for production's org (Infisical `fountain`,
      # SPRITES_LIVE_TEST_TOKEN): it can reach every sprite there, users'
      # included. The suite only ever names `msb-live-` sprites, and only
      # main's schedule and dispatch run this job. The org caps running
      # sprites at 20; the suite's go cold within about 30 s of their test.
      SPRITES_TOKEN: ${{ secrets.SPRITES_TOKEN }}

    steps:
      - name: Require the Sprites token
        run: |
          if [ -z "${SPRITES_TOKEN}" ]; then
            echo "::error::SPRITES_TOKEN is not configured for this repository."
            exit 1
          fi

      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-live-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-live-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-live-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-live-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Wait for Postgres
        run: |
          set -uo pipefail
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          exit 1

      - name: Set up database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet

      - name: Live Sprites suite
        working-directory: apps/fountain
        timeout-minutes: 18
        run: |
          mix test --only live test/live/sandbox_sprites_live_test.exs && exit 0
          echo "::warning::Sprites live tests failed once; re-running only those"
          mix test --only live --failed

      - name: Destroy leftover live sprites
        if: always()
        timeout-minutes: 3
        run: |
          token=""
          while :; do
            page="$(curl -fsS -H "Authorization: Bearer ${SPRITES_TOKEN}" \
              "https://api.sprites.dev/v1/sprites?prefix=msb-live-${token:+&continuation_token=${token}}")" || break
            jq -r '.sprites[].name' <<< "${page}" | while read -r name; do
              echo "destroying ${name}"
              curl -fsS -X DELETE -H "Authorization: Bearer ${SPRITES_TOKEN}" \
                "https://api.sprites.dev/v1/sprites/${name}" || true
            done
            [ "$(jq -r '.has_more' <<< "${page}")" = "true" ] || break
            token="$(jq -r '.next_continuation_token' <<< "${page}")"
          done
