# Non-secret configuration. Secrets (SECRET_KEY_BASE, MASTER_SECRETS_KEY,
# DATABASE_URL, SPRITES_TOKEN, mail credentials) belong in the
# `fountain-secrets` Secret — see README.md for the create command.
apiVersion: v1
kind: ConfigMap
metadata:
  name: fountain-config
data:
  # The externally-visible URL, scheme included. Builds verification and
  # password-reset links and is handed to every sandbox as FOUNTAIN_BASE_URL,
  # so it must resolve from outside the cluster. An https:// value also turns
  # on the HTTPS redirect, HSTS and secure cookies — your ingress must then
  # set X-Forwarded-Proto or every request looks like http and redirect-loops.
  PUBLIC_URL: "https://fountain.example.com"

  # An instance on the public internet with registration open will be found.
  # Open it just long enough to register yourself, or scope it:
  # REGISTRATION_ALLOWED_EMAIL_DOMAINS: "example.com"
  REGISTRATION_ENABLED: "true"

  # CIDRs stepped over when resolving the client IP from X-Forwarded-For.
  # The app's built-in default trusts the k3s networks (10.42.0.0/16,
  # 10.43.0.0/16, loopback) — the maintainer's cluster, not necessarily
  # yours. Set this to your ingress-controller and pod CIDRs (the example
  # below is the kubeadm/flannel default). Symptom when wrong: every request
  # resolves to the ingress pod's IP, so per-IP rate limits collapse into a
  # single shared bucket and one busy client throttles everyone. Don't go
  # over-broad either — a range that includes real clients lets them spoof
  # X-Forwarded-For past rate limiting.
  # TRUSTED_PROXIES: "10.244.0.0/16, 10.96.0.0/12"

  # "none" sends nothing: verify your first account with
  #   kubectl exec -n fountain deploy/fountain -- \
  #     sh -c "PHX_SERVER=false bin/fountain_server eval 'Fountain.Release.verify_email(\"you@example.com\")'"
  # For real delivery set RESEND_API_KEY or SMTP_* in fountain-secrets and
  # delete this key.
  EMAIL_DELIVERY: "none"

  # On by default; set to "false" only if your Postgres does not serve TLS.
  # DATABASE_SSL_VERIFY / DATABASE_SSL_CA_FILE upgrade encryption to actual
  # verification — see the self-hosting guide.
  DATABASE_SSL: "true"

  # Pods migrate at boot by default, at any replica count — the migration
  # lock is a Postgres advisory lock, so a cold start of several replicas
  # against an empty database does not race. Set this to "false" only if you
  # run migrations as a Job instead (README.md has the manifest); nothing
  # checks that the Job ran, and a pod that skips migrations against an
  # un-migrated database boots and then fails on the first query.
  # MIGRATE_ON_BOOT: "false"

  # Trace export is off by default — nothing leaves the instance. To ship
  # traces to a collector, set OTEL_EXPORTER_OTLP_ENDPOINT (and
  # OTEL_EXPORTER_OTLP_HEADERS if it needs auth); see docs/configuration.md.
