name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # The merge queue. Every required check must name this event or the queue
  # waits for a check that never arrives, times out and ejects the PR.
  merge_group:

concurrency:
  # PR updates supersede one another. Main commits and merge groups validate
  # independently: a shared main group both delayed feedback and cancelled
  # older pending runs, and cancelling a queue run ejects the PR it was
  # deciding. build.yml's built-ancestor diff includes changes from any
  # unbuilt ancestor.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Independent jobs keep feedback near the slowest test partition plus coverage.
# Six partitions share a :test cache; static analysis, bundled release and core
# release use their own build caches. Postgres starts alongside toolchain setup.
# The partition manifest reserves time on partition 1 for the sibling apps.
#
# CI required verifies the selected plan, including intentional skips. A green
# PR publishes the actual checkout tree; main may reuse that proof, otherwise
# it runs the complete suite. Docs compilation, internal links, snippets,
# anchors and CLI reference parity remain blocking.
#
# The one Postgres pin. Jobs start it in the background before they need it.
env:
  PG_IMAGE: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb

jobs:
  already-tested:
    name: Skip the re-run when a PR already tested this exact tree
    # Main and the merge queue. On pull_request this job is skipped, its
    # outputs are empty, and the `!= 'true'` tests below let everything run as
    # before.
    #
    # In the queue it answers "is this group's tree one a PR run already
    # tested?" — true whenever a single up-to-date PR is queued alone, which
    # is what keeps the queue's throughput near today's. A batch combines
    # trees no PR run ever had, so it falls through to the full suite.
    if: ${{ github.event_name == 'push' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read
      pull-requests: read
      actions: read

    outputs:
      skip: ${{ steps.probe.outputs.skip }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Compare this tree with a successful PR checkout
        id: probe
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/already-tested.sh

  changes:
    name: Classify documentation changes
    # Never on push, and deliberately so. There, `already-tested` above
    # already collapses a rebased squash-merge to a few seconds, and a main
    # push that is NOT already-tested is precisely the case that must run
    # everything. Skipped means empty outputs, and the `!= 'true'` tests
    # below let every job run exactly as before — the same shape the
    # already-tested gate uses.
    #
    # The queue classifies its group for the same reason a PR does: without
    # this, every docs-only merge would run the full Elixir suite on the way
    # in, which is 11% of what lands here.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group'
         || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      manual_docs: ${{ steps.filter.outputs.manual_docs }}
      cli_docs: ${{ steps.filter.outputs.cli_docs }}
      tree: ${{ steps.tree.outputs.tree }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Record the checkout tree
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Classify the diff
        id: filter
        # Unknown paths, failed diffs and manual dispatch select the full
        # server plan.
        env:
          # Empty on pull_request, which is how the script picks its base.
          MERGE_GROUP_BASE_SHA: ${{ github.event.merge_group.base_sha }}
        run: |
          set -u
          base=""
          decide() {
            echo "diff_base=${base:-}" >> "$GITHUB_OUTPUT"
            python3 scripts/ci/changes.py "${base:-}" >> "$GITHUB_OUTPUT"
            exit "$?"
          }

          # A manual run requests complete validation, without a diff or
          # tree-reuse shortcut.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            decide
          fi

          # A merge group already knows the commit it was stacked onto, and
          # there is no base *ref* to fetch: the group branch is transient and
          # its base moves under it. A PR keeps the merge-base walk.
          if [ -n "${MERGE_GROUP_BASE_SHA}" ]; then
            base="${MERGE_GROUP_BASE_SHA}"
            if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              echo "merge group base ${base:0:7} is not in this checkout — running the full CI"
              base=""
              decide
            fi
          else
            if ! git fetch --no-tags --quiet origin \
                 "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" 2>/dev/null; then
              echo "could not fetch base ${GITHUB_BASE_REF} — running the full CI"
              decide
            fi

            base="$(git merge-base "refs/remotes/origin/${GITHUB_BASE_REF}" HEAD 2>/dev/null || true)"
            if [ -z "${base}" ]; then
              echo "no merge base with ${GITHUB_BASE_REF} — running the full CI"
              decide
            fi
          fi

          decide

  test:
    name: Build and Test (partition ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [already-tested, changes]
    # `!cancelled()` rather than the implicit success(): on pull_request the
    # gate job is skipped, and a skipped `needs` would skip this job too.
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    strategy:
      # Each partition is an independent verdict and all six are wanted: a
      # cancelled sibling would leave the coverage merge without its export and
      # turn one test failure into two unrelated-looking ones.
      fail-fast: false
      matrix:
        # The single source of truth for how many partitions there are — the
        # `--partitions` argument below is `strategy.job-total`, so adding an
        # entry here is the whole change.
        #
        # Balance measured work before increasing the runner count. Partition
        # 1 also runs the siblings, which the allocator reserves time for.
        partition: [1, 2, 3, 4, 5, 6]

    outputs:
      # Same value from every partition, so which one wins the race to set it
      # does not matter. The coverage job uses it to check that it merged an
      # export from every partition rather than from whichever ones uploaded.
      partitions: ${{ steps.total.outputs.count }}

    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      - name: Mix lock backport preserves port reuse and cross-VM exclusion
        if: ${{ matrix.partition == 1 }}
        run: elixir scripts/ci/mix-lock-backport-test.exs

      - name: Timing collection preserves ExUnit execution
        if: ${{ matrix.partition == 1 }}
        run: elixir scripts/ci/timing-formatter-test.exs

      - name: Mix stall diagnostics capture lock holders and waiters
        if: ${{ matrix.partition == 1 }}
        run: elixir scripts/ci/mix-diagnostics-test.exs

      # Cache keys carry the job name. `test` and `checks` build different
      # trees — this one only ever compiles :test, while `checks` additionally
      # builds :dev for dialyzer and :prod for the release — and a shared key
      # would have them racing to save mutually incomplete archives under it,
      # winner decided by whichever finished first. Same reasoning as the
      # deliberately-narrow restore-keys below: a cache whose contents depend
      # on who got there first is the failure mode being avoided.
      #
      # The partitions DO share a key, and that is not the same race:
      # they compile one identical :test tree and differ only in which test
      # files they load, so whichever wins the save has saved the same archive
      # the others would have. Giving each partition its own key would multiply
      # the storage for identical content and stop them warming each other.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback: BEAM bytecode compiled by a different
          # OTP/Elixir is rebuilt from scratch anyway, and a cross-version
          # restore has produced subtle staleness — the same hazard the PLT
          # cache in `checks` avoids by omitting restore-keys entirely.
          restore-keys: |
            ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        # #1997 stalled inside Mix before tests began. Capture the live lock
        # holders and process tree before the unchanged job timeout cancels it.
        env:
          MIX_DIAGNOSTICS: "1"
        run: |
          elixir -r scripts/ci/mix-diagnostics.exs -S mix ecto.create --quiet
          elixir -r scripts/ci/mix-diagnostics.exs -S mix ecto.migrate --quiet

      # Coverage instrumentation is free here — measured at 128.8s with cover
      # against 128.6s without, on the same machine. Running the suite bare on
      # PRs and gating coverage elsewhere would buy nothing and cost the gate.
      #
      # The script exists for the assertion, not for the mix invocation: with
      # partitioning, "ran zero tests" and "passed" are both exit 0, so it
      # parses ExUnit's summary line and refuses to succeed without one. See
      # the header of scripts/test-partition.sh.
      - name: Run tests with coverage
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: scripts/test-partition.sh ${{ strategy.job-total }}

      # The sibling umbrella apps — a managoat_* library on its way out
      # (decisions/0037) and the first-party extensions (apps/fountain_buzz and
      # apps/fountain_support, decisions/0043) — are not in the partition manifest: their tests belong
      # to those apps, run from their own directories and instrument their own
      # modules, and apps/fountain cannot even load them because it depends on
      # neither. One partition runs them all and copies the exports into the
      # merge directory as lib-*, so the coverage gate below stands on the
      # union. The allocator reserves their measured duration on partition 1
      # instead of treating that partition as an equally empty bucket.
      - name: Run the sibling apps' tests with coverage
        if: ${{ matrix.partition == 1 }}
        run: scripts/test-libraries.sh

      - name: Publish the partition count
        id: total
        run: echo "count=${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage export
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverdata-${{ matrix.partition }}
          # The lib-* globs match only on the partition that ran the library
          # apps; if-no-files-found looks at the set as a whole, so the other
          # partitions still upload their own pair without complaint.
          path: |
            apps/fountain/cover/${{ matrix.partition }}.coverdata
            apps/fountain/cover/${{ matrix.partition }}.tests
            apps/fountain/cover/${{ matrix.partition }}.timings.log
            apps/fountain/cover/lib-*.coverdata
            apps/fountain/cover/lib-*.tests
          # An export that silently fails to upload would leave the merge job
          # gating on a fraction of the suite while still printing a number.
          if-no-files-found: error
          retention-days: 1

  # The 85% gate, enforced once against every partition's data. It is a
  # separate job because there is nowhere else it can live: no partition can
  # see the others' coverage, and ExCoveralls — which this replaced in #620 —
  # had no way to merge across machines at all. Elixir's built-in cover does,
  # via the exports `mix test --partitions` writes.
  #
  # Deliberately light: checkout, Elixir setup, artifact download and a merge.
  # The plain Elixir script needs no database, dependencies or compiled app.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    # Still "after a green suite" — but spelled out, because test is skipped
    # (not failed) on the already-tested path and must not drag this along.
    if: ${{ !cancelled() && needs.test.result == 'success' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      - name: Download coverage exports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: apps/fountain/cover

      # `mix test.coverage` reports on whatever exports it finds and says
      # nothing about the ones it did not. Two partitions' data would produce a
      # real-looking table with a number nobody could interpret, so the count
      # is checked before the threshold is trusted. Summing the per-partition
      # test counts is the same check from the other side, and puts the size of
      # the suite the gate stood on into the log.
      - name: Check every partition reported
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=${{ needs.test.outputs.partitions }}
          exports=(apps/fountain/cover/[0-9]*.coverdata)
          if [ "${#exports[@]}" -ne "$expected" ]; then
            echo "merged ${#exports[@]} coverage exports, expected $expected" >&2
            exit 1
          fi
          # The sibling apps' exports (scripts/test-libraries.sh): one per
          # umbrella app other than fountain — a managoat_* library on its way
          # out (decisions/0037) or a first-party extension (decisions/0043) — or the
          # gate would stand on the partitions alone and their coverage would go
          # unmeasured.
          libs=()
          for dir in apps/*/; do
            [ "$dir" = "apps/fountain/" ] && continue
            libs+=("$dir")
          done
          lib_exports=(apps/fountain/cover/lib-*.coverdata)
          if [ "${#lib_exports[@]}" -ne "${#libs[@]}" ]; then
            echo "merged ${#lib_exports[@]} sibling exports, expected ${#libs[@]} (one per apps/* other than fountain)" >&2
            exit 1
          fi
          total=$(cat apps/fountain/cover/*.tests | awk '{s += $1} END {print s + 0}')
          echo "merging ${#exports[@]} partitions and ${#lib_exports[@]} library apps covering $total tests"

      # Not `mix test.coverage`: ~90% of that task's time is rendering an
      # HTML report — 530 files, 129MB — that this job never opens, since all
      # it does is assert a threshold and exit. The script computes the same
      # number from the same coverage.exs (verified identical, 85.46% both, on
      # the same six exports), and prints the least-covered modules so a
      # failure still says where to look.
      #
      # `elixir`, not `mix run`: the script reads .coverdata and coverage.exs
      # and touches nothing else, so it needs no deps, no _build and no
      # compile. Through `mix run` this step spent most of its time
      # recompiling the app for a script that never calls it ("Compiling 10
      # files" for a 12s step). That is also why this job no longer restores
      # the deps/build caches or runs deps.get.
      #
      # Run `mix test.coverage` locally for the full table and the HTML.
      - name: Enforce the coverage threshold
        run: elixir scripts/coverage-gate.exs

  elixir-static:
    name: Elixir static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      # Job-scoped keys — see the note in `test`.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-static-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-static-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-static-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback, for the reason given in `test`.
          restore-keys: |
            ${{ runner.os }}-build-static-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --unused && git diff --exit-code mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # --strict, matching `mix precommit`. CI used to run the default profile
      # while precommit ran --strict, so a strict violation passed CI and only
      # showed up for whoever ran precommit next.
      - name: Run Credo
        run: mix credo --strict

      - name: Audit dependencies
        # Security advisories block the build unless explicitly acknowledged in
        # mix.exs. Retirements stay visible without breaking unrelated work: an
        # upstream maintainer can retire a package at any moment.
        run: elixir scripts/hex-audit-gate.exs

      # Not plain `mix sobelow`: at the umbrella root sobelow detects no
      # Phoenix app, scans nothing, and exits 0 — indistinguishable from a
      # pass (#194, #311). The script scans a merged tree so ee/lib web
      # modules are covered too (decisions/0010).
      - name: Security scan (sobelow)
        run: scripts/sobelow.sh

      # The PLT encodes OTP + deps; rebuilding it cold takes minutes, so it is
      # cached on the exact beam versions + lockfile. mix.exs pins its path to
      # priv/plts for this cache. restore-keys deliberately omitted: a PLT from
      # different versions would be rebuilt anyway.
      - name: Restore dialyzer PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      # MIX_ENV=dev on purpose (the job env is test): dialyzer analyzes the
      # shipped code; the test env would drag test/support and test-only deps
      # into the analysis and the PLT.
      - name: Dialyzer
        run: MIX_ENV=dev mix dialyzer --format github

  release-and-contract:
    name: Release boot and the API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    # Postgres is here for the release boot check: /health/ready calls
    # Fountain.Health.database/0, and the release task that runs after it
    # queries users. Both need a migrated fountain_test to answer honestly.
    # `mix openapi.export` and `mix openapi.spec.json` boot the app too, which
    # is why the contract steps are in this job rather than beside the clients
    # that consume what they produce.
    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      # Job-scoped keys — see the note in `test`.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-release-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-release-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-release-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback, for the reason given in `test`.
          restore-keys: |
            ${{ runner.os }}-build-release-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # For the release boot check below, not for a test suite — this job runs
      # none. /health/ready and the release task below both read the database.
      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # Builds a release and runs its config providers. Config.Reader tests
      # validate config *values*; only a real boot catches a key that may not be
      # set at runtime at all. A `force_ssl` moved into runtime.exs passed every
      # test and then CrashLoopBackOff'd every pod with:
      #   ERROR! the application :fountain has a different value set for path
      #   [:force_ssl] inside key FountainWeb.Endpoint during runtime compared
      #   to compile time.
      # Two distinct failures have shipped past every other check here, one
      # after the other, from the same change:
      #
      #   1. force_ssl set from runtime.exs failed validate_compile_env and the
      #      node aborted during boot.
      #   2. the node then booted fine and Plug.SSL 301'd every kubelet probe,
      #      so no pod ever became ready.
      #
      # From outside they look identical — pods not Ready, rollout stalled — and
      # neither is visible to a Config.Reader test or to `mix test`. So this
      # boots a real release with production-shaped config and then asks it the
      # questions kubelet asks: over plain http, on the pod's own port, with no
      # proxy and no X-Forwarded-Proto.
      #
      # The Host header matters more than the address. Plug.SSL's default
      # exclude is [hosts: ["localhost", "127.0.0.1"]], so a probe sent to
      # either name is never redirected and this check would pass while
      # production 301s. kubelet dials the pod IP, which is in neither list, so
      # the probe carries a pod-shaped Host to reproduce that.
      - name: Release boots and answers its health probes
        env:
          MIX_ENV: prod
          PHX_SERVER: "true"
          PORT: "4000"
          SECRET_KEY_BASE: ci-only-not-a-secret-000000000000000000000000000000000000000000000000
          # 43 chars of base64url = 32 zero bytes. Valid format, obviously not a key.
          MASTER_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          DATABASE_URL: postgres://postgres:postgres@localhost/fountain_test
          # The CI Postgres service serves no TLS, and DATABASE_SSL defaults on
          # in prod — without this the release dies on a connection timeout and
          # the step fails for a reason that has nothing to do with the app.
          DATABASE_SSL: "false"
          PUBLIC_URL: https://ci.example.com
          EMAIL_DELIVERY: none
          # No collector on a runner; without this the exporter retries per span.
          OTEL_TRACES_EXPORTER: none
        run: |
          set -euo pipefail
          mix deps.get --only prod
          mix release fountain_server --overwrite

          # Config providers run here. A key that may not be set at runtime
          # aborts boot at this point rather than serving anything.
          _build/prod/rel/fountain_server/bin/fountain_server eval 'IO.puts("config ok")'

          _build/prod/rel/fountain_server/bin/fountain_server daemon
          trap '_build/prod/rel/fountain_server/bin/fountain_server stop || true' EXIT

          probe() {
            # Exactly, not "2xx or 3xx". A 301 is what broke production: curl
            # -f does not fail on a redirect, so the status has to be compared.
            for _ in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.42.0.1' "http://127.0.0.1:4000$1") || code=000
              if [ "$code" = "200" ]; then
                echo "  $1 -> 200"
                return 0
              fi
              if [ "$code" != "000" ] && [ "$code" != "502" ]; then
                echo "  $1 -> $code (expected 200)" >&2
                return 1
              fi
              sleep 2
            done
            echo "  $1 never answered" >&2
            return 1
          }

          probe /health
          probe /health/ready

          # Release tasks must be runnable while the server owns the ports,
          # and without PHX_SERVER — the shape they actually run in, both
          # in-pod and via compose exec. A release task once booted the
          # entire app from eval and died on eaddrinuse against a running
          # server; with PHX_SERVER=false the repo had no config at all.
          # Both regressions fail exactly here.
          echo "release task runs beside the live server:"
          PHX_SERVER=false _build/prod/rel/fountain_server/bin/fountain_server \
            eval 'Fountain.Release.rebuild_credit_lots()'

      - name: Validate OpenAPI spec
        run: mix openapi.spec.json --spec FountainWeb.ApiSpec --output /tmp/openapi.json && jq empty /tmp/openapi.json

      # One API, four clients (#1411). The server's OpenAPI document is the
      # only description of the wire; everything below derives from it.
      #
      # This step builds the two artifacts and fails if the committed one is
      # stale. `sdk/contract/contract.json` is the document projected down to
      # shape alone, with descriptions and info.version dropped, so it moves
      # only when the wire moves — and it is committed so the Swift job, which
      # has no Elixir, can check against it from the checkout.
      #
      # It also fails when an operation is neither claimed by an SDK manifest
      # nor written down in sdk/contract/omissions.json, which is what stops a
      # new endpoint from quietly reaching no client at all.
      - name: SDK wire contract is current
        run: scripts/sdk-contract/build.sh --check

      # The TypeScript SDK (sdk/typescript). Node runs the .ts sources
      # directly, so `npm test` needs nothing but the dev dependency on tsc —
      # which is also what enforces `erasableSyntaxOnly`, the setting that
      # keeps those sources runnable without a build step.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # `--no-audit --no-fund`: see the typescript-sdk job, which carries the
      # measurement. Here it is only to make `npm run generate` runnable.
      - name: SDK install
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund

      # The TypeScript SDK's types are generated from that spec, not written by
      # hand, so a schema change in Elixir must reach
      # `sdk/typescript/src/generated`. Regenerating here and failing on a diff
      # is what keeps them the same thing rather than two descriptions of the
      # API that drift apart. This is the arm that covers the WHOLE document;
      # the manifest checks below cover what each client reaches for by name.
      - name: SDK types match the spec
        run: python3 scripts/sdk-contract/generate.py --target typescript --skip-export --check

  elixir-sdk:
    name: Elixir SDK (${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    # Independent from the umbrella, Postgres and the other SDK toolchains.
    env:
      MIX_ENV: test

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.15.8"
            otp: "26.2.5.21"
          - elixir: "1.19.2"
            otp: "28.3"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: SDK conformance scenarios are well formed
        run: python3 sdk/conformance/lint.py

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      # The Elixir SDK is a standalone Mix project. Keep its dependency graph
      # and build artifacts separate from the umbrella's cache.
      - name: Restore Elixir SDK cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            sdk/elixir/deps
            sdk/elixir/_build
          key: ${{ runner.os }}-sdk-elixir-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('sdk/elixir/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-sdk-elixir-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Elixir SDK dependencies
        working-directory: sdk/elixir
        run: MIX_ENV=dev mix deps.get

      # Formatter output changes across Elixir versions. The current
      # toolchain owns style; both pairs check runtime compatibility.
      - name: Elixir SDK formatting
        if: ${{ matrix.elixir == '1.19.2' }}
        working-directory: sdk/elixir
        run: mix format --check-formatted

      - name: Elixir SDK compile
        working-directory: sdk/elixir
        run: mix compile --warnings-as-errors

      - name: Elixir SDK tests
        working-directory: sdk/elixir
        run: mix test

      - name: Elixir SDK documentation
        working-directory: sdk/elixir
        run: MIX_ENV=dev mix docs --warnings-as-errors

      - name: Elixir SDK package dry run
        working-directory: sdk/elixir
        run: MIX_ENV=dev mix hex.build

      - name: Additive conversation fields (elixir)
        run: python3 scripts/sdk-contract/check-propagation.py --client elixir

      - name: Elixir SDK contract
        working-directory: sdk/elixir
        run: mix test test/contract_test.exs

      - name: Elixir SDK conformance
        working-directory: sdk/elixir
        run: mix test test/conformance_test.exs

  python-sdk:
    name: Python SDK (${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: SDK conformance scenarios are well formed
        run: python sdk/conformance/lint.py

      # The SDK has no runtime dependencies. Check source syntax and wire
      # assumptions, then exercise the built distribution below.
      - name: Python SDK compiles
        run: python -m compileall -q sdk/python/src sdk/python/scripts

      - name: Additive conversation fields (python)
        run: python3 scripts/sdk-contract/check-propagation.py --client python

      - name: Python SDK contract
        working-directory: sdk/python
        run: python scripts/verify_contract.py

      - name: Python SDK conformance
        working-directory: sdk/python
        run: python -m unittest discover -s tests -p "test_conformance.py" -v

      - name: Python SDK build tool
        run: python -m pip install --disable-pip-version-check build

      - name: Python SDK package dry run
        run: python -m build --outdir "$RUNNER_TEMP/python-sdk-dist" sdk/python

      - name: Python SDK installed wheel
        run: python sdk/python/scripts/verify_wheel.py "$RUNNER_TEMP"/python-sdk-dist/*.whl

  typescript-sdk:
    name: TypeScript SDK (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: SDK conformance scenarios are well formed
        run: python3 sdk/conformance/lint.py

      # Node 24 runs the TypeScript test sources directly. The minimum
      # runtime runs JavaScript compiled from those same tests. Both legs
      # typecheck, build and verify the SDK contract and browser bundle.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # `--no-audit` is the whole reason this step is not the longest in CI.
      # `npm ci` runs a vulnerability audit by default, which is one POST to
      # registry.npmjs.org/-/npm/v1/security/advisories/bulk — and that request
      # stalls from Actions runners rather than failing fast. Measured on this
      # lockfile: 35 packages, every tarball fetched in 325ms from a warm
      # cache, and then `reify:audit Completed in 300202ms`. The step was
      # taking 88s to 302s depending on how far into npm's 5-minute timeout the
      # request got, on every PR, and it made this job 426s against 171s for
      # the slowest test partition. With the flag it is under 5s.
      #
      # Nothing is lost, because nothing was gated: `npm ci` does not fail on
      # advisories, so this could only ever print "found 0 vulnerabilities"
      # into a log. What DOES watch these packages is dependabot, which was
      # given its two npm ecosystems in the same change that added this flag --
      # before that the audit line was the only npm advisory signal in the
      # repository, and it was one nobody could act on. `--no-fund` suppresses
      # the funding notice for the same reason: it is output, not a check.
      - name: SDK install
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund

      - name: SDK typecheck
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: SDK tests on the minimum runtime
        if: ${{ matrix.node == '20.19.0' }}
        working-directory: sdk/typescript
        run: node scripts/test-compiled.mjs

      - name: SDK tests
        if: ${{ matrix.node == '24' }}
        working-directory: sdk/typescript
        run: npm test

      - name: SDK build
        working-directory: sdk/typescript
        run: npm run build

      # Eleven browser applications are built on this API, so the SDK's default
      # entry has to bundle for a browser — no Node built-ins reachable from it.
      - name: SDK bundles for the browser
        working-directory: sdk/typescript
        run: npx --yes esbuild dist/index.js --bundle --platform=browser --format=esm --outfile=/dev/null

      - name: SDK packed artifact
        working-directory: sdk/typescript
        run: node scripts/verify-package.mjs

      - name: Additive conversation fields (typescript)
        run: python3 scripts/sdk-contract/check-propagation.py --client typescript

      - name: TypeScript SDK contract
        working-directory: sdk/typescript
        run: npm run verify-contract

      - name: TypeScript SDK conformance on the minimum runtime
        if: ${{ matrix.node == '20.19.0' }}
        working-directory: sdk/typescript
        run: node scripts/test-compiled.mjs --conformance

      - name: TypeScript SDK conformance
        if: ${{ matrix.node == '24' }}
        working-directory: sdk/typescript
        run: npm run conformance

  cli-plugins:
    name: CLI and plugins
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    # Go CLIs and plugins have no dependency on an SDK build.
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            apps/fountain_buzz/cli/go.sum

      # The CLI had tests since launch that no workflow ever ran, so they gated
      # neither a merge nor a release.
      #
      # `-count=1` disables Go's test cache, and it is load-bearing rather than
      # belt-and-braces (#1542). `TestExamplesParse` reads its inputs from
      # `examples/`, outside its own package, so Go has no reliable way to know
      # those inputs moved — and `setup-go`'s cache is keyed on `cli/go.sum`,
      # which does not move when an example changes. Go caches only successes,
      # so the stale entry it kept serving was a pass from before the example
      # that broke it existed: CI reported `ok (cached)` for a day while a
      # fresh run failed. The suite takes about two seconds; a cache that can
      # report green for a red tree is not worth that.
      - name: Additive conversation fields (CLI)
        run: python3 scripts/sdk-contract/check-propagation.py --client cli

      - name: CLI tests
        working-directory: cli
        run: go test -count=1 ./...

      - name: CLI vet
        working-directory: cli
        run: go vet ./...

      # The Buzz provider is a second Go module (ADR 0043 decision 6, #1508),
      # so `go test ./...` in cli/ does not reach it. Separate steps rather
      # than a loop, for the same reason the SDK contract checks are separate:
      # a failing log line should name the module a contributor has to fix.
      #
      # It is the extension's, and it graduates with the extension (#1510) —
      # at which point these steps move to that repository's CI and the
      # `replace` in its go.mod becomes a version pin.
      - name: Buzz provider tests
        working-directory: apps/fountain_buzz/cli
        run: go test -count=1 ./...

      - name: Buzz provider vet
        working-directory: apps/fountain_buzz/cli
        run: go vet ./...

      # `gofmt -l` prints offending files and exits 0, so the failure has to
      # come from the emptiness check — print the list first so the log says
      # which files to run gofmt on.
      - name: CLI gofmt
        run: |
          unformatted=$(gofmt -l cli apps/fountain_buzz/cli)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      # The Hermes plugin (integrations/hermes) is stdlib Python; its tests
      # run against an in-process fake Fountain and need nothing installed.
      - name: Hermes plugin tests
        run: python3 -m unittest discover -s integrations/hermes/tests -v

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Deployed-instance runner tests
        run: node --test deployed/test/*.test.mjs

  swift-sdk:
    name: Swift SDK (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true' }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]

    steps:
      # The generator's compatibility guard reads the last release's Swift
      # models from their tag, so this job needs tags and their trees. The
      # committed output cannot serve as that baseline: a change that makes a
      # property required and regenerates would offer its own candidate as the
      # record of what shipped (#2284).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Swift on Linux
        if: ${{ runner.os == 'Linux' }}
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.1.3"

      # Xcode 16.4 already supplies Apple Swift 6.1.2, satisfying the package's
      # 6.1 minimum. Pin the Xcode selection and avoid downloading a second
      # compiler. Linux exercises the upstream Swift 6.1.3 toolchain above.
      - name: Select Apple Swift on macOS
        if: ${{ runner.os == 'macOS' }}
        env:
          DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
        run: |
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          dirname "$(xcrun --find swift)" >> "$GITHUB_PATH"
          xcrun swift --version

      - name: Check Swift SDK version
        run: |
          server_version="$(sed -nE 's/.*version: "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' mix.exs | head -n 1)"
          sdk_version="$(sed -nE 's/public let fountainSDKVersion = "([^"]+)"/\1/p' sdk/swift/Sources/Fountain/Fountain.swift)"
          kit_version="$(sed -nE 's/public let fountainKitVersion = "([^"]+)"/\1/p' sdk/swift/Sources/FountainKit/Version.swift)"
          test -n "${server_version}"
          test "${sdk_version}" = "${server_version}"
          test "${kit_version}" = "${server_version}"

      - name: Generated Swift conversation models are current
        run: python3 scripts/sdk-contract/generate.py --target swift --skip-export --check

      - name: Swift format
        run: swift format lint --strict --recursive Package.swift sdk/swift/Sources sdk/swift/Tests

      # Its own step, though `swift test` below runs it too, so a wire change
      # says "Swift SDK contract" in the checks list rather than hiding inside
      # a suite of forty. This job has no Elixir: the check reads the committed
      # sdk/contract/contract.json, which is why that file is committed (#1411).
      - name: Additive conversation fields (swift)
        run: python3 scripts/sdk-contract/check-propagation.py --client swift

      - name: Swift SDK contract
        run: swift test --configuration debug -Xswiftc -warnings-as-errors --filter ContractTests

      # The behavioural half (#1412), the same scenarios the other three run.
      # Its own step for the same reason: a divergence should say "Swift SDK
      # conformance" in the checks list, not hide inside a suite of forty.
      - name: Swift SDK conformance
        run: swift test --configuration debug -Xswiftc -warnings-as-errors --filter ConformanceTests

      # Includes the loopback streaming test, which used to need a process of
      # its own while the SDK still cancelled finished URLSessionTasks and
      # tripped FoundationNetworking's task registry at teardown (#1410).
      - name: Swift debug tests
        run: swift test --configuration debug -Xswiftc -warnings-as-errors

      - name: Swift release build
        run: swift build --configuration release -Xswiftc -warnings-as-errors

  # ADR 0043 decision 7 promises two distributions from one tree: the bundled
  # release, which every existing tag has meant, and a core release that carries
  # no extension at all. Until this job existed the core half was an assertion —
  # `apps/fountain` running alone in the test partitions proves the TEST path,
  # and the release path was proved only by `mix release` assembling with every
  # `applications:` entry present.
  #
  # Its own job rather than a step in `checks`, for two reasons: that job is
  # already close to its 15-minute ceiling (#1537), and a red here should say
  # one thing — "the core distribution does not work" — rather than arrive
  # buried in static analysis.
  core-distribution:
    name: Core distribution boots without the extensions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    env:
      PG_IMAGE: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb

    steps:
      # Backgrounded rather than a service container, for the reason the test
      # job's copy explains: a service container's ~27s sits on the critical
      # path before the first step runs.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_core \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-core-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-core-

      - name: Restore core build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            _build/prod/lib
            _build/prod/.mix
          key: ${{ runner.os }}-build-core-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('mix.lock', 'mix.exs', 'apps/*/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-build-core-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Wait for Postgres
        run: |
          set -euo pipefail
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      # BUNDLE_EXTENSIONS is read by `extension_applications/0` in mix.exs and by the
      # Dockerfile's asset stage; one switch drives both halves so an image
      # cannot end up with an extension application and no binaries (#1509).
      - name: Build the core release
        env:
          MIX_ENV: prod
          BUNDLE_EXTENSIONS: "false"
        run: |
          set -euo pipefail
          mix deps.get --only prod
          rm -rf _build/prod/rel
          mix release fountain_server

      # The assertion the campaign has been making since #1507. `mix release`
      # is happy to build a release containing an application nobody asked
      # for, so the contents are checked rather than trusted.
      - name: The core release carries no extension
        run: |
          set -euo pipefail
          apps=$(ls _build/prod/rel/fountain_server/lib | sed -E 's/-[0-9.]+$//' | sort)
          echo "$apps" | tr '\n' ' '; echo
          # `apps/fountain_*` is the extension naming convention. A
          # `managoat_*` library under apps/ would be a DEPENDENCY of fountain
          # and legitimately in both releases, so it must not be swept up here.
          for ext in $(ls apps | grep '^fountain_'); do
            if echo "$apps" | grep -qx "$ext"; then
              echo "::error::the core release contains $ext" >&2
              exit 1
            fi
          done
          echo "no extension application in the core release"

      # A FRESH database, migrated by the core release itself. This is the
      # check that would have caught the crossing #1509 found by accident: a
      # core migration altering `buzz_identities`, a table a core distribution
      # does not have. Nothing but a core release against an empty database
      # exercises that path.
      - name: The core release boots, migrates and answers its health probes
        env:
          MIX_ENV: prod
          PHX_SERVER: "true"
          PORT: "4000"
          SECRET_KEY_BASE: ci-only-not-a-secret-000000000000000000000000000000000000000000000000
          MASTER_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          DATABASE_URL: postgres://postgres:postgres@localhost/fountain_core
          DATABASE_SSL: "false"
          PUBLIC_URL: https://ci.example.com
          EMAIL_DELIVERY: none
          OTEL_TRACES_EXPORTER: none
        run: |
          set -euo pipefail
          rel=_build/prod/rel/fountain_server/bin/fountain_server

          # Config providers run here, against a release whose :extensions list
          # resolves to nothing. A core release that names an extension it does
          # not carry aborts in Fountain.Extensions.validate!/0, at this line.
          "$rel" eval 'IO.puts("config ok")'

          # Migrations run on boot. An empty database plus a core-only path set
          # is the whole point of this step.
          "$rel" daemon
          trap '"$rel" stop || true' EXIT

          probe() {
            for _ in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.42.0.1' "http://127.0.0.1:4000$1") || code=000
              if [ "$code" = "200" ]; then
                echo "  $1 -> 200"
                return 0
              fi
              if [ "$code" != "000" ] && [ "$code" != "502" ]; then
                echo "  $1 -> $code (expected 200)" >&2
                return 1
              fi
              sleep 2
            done
            echo "  $1 never answered" >&2
            return 1
          }

          probe /health
          probe /health/ready

          # The document describes the running distribution (ADR 0043). A core
          # release advertising an operation it cannot serve would be a lie the
          # SDKs are generated from.
          #
          # Asked of the running node with `rpc`, not fetched over HTTP. The
          # first version curled /api/openapi.json and got a **301** — prod
          # enforces HTTPS and only the health paths are excluded — which
          # `curl -f` does not treat as a failure, so it wrote an empty file,
          # `jq` exited 0 with no output, and the check passed on nothing. That
          # is the same redirect trap the bundled boot check's own comment
          # warns about, walked into one step later.
          #
          # `eval` cannot do this either: ApiSpec.spec/0 reaches the Endpoint
          # through OpenApiSpex.Server.from_endpoint/1, which needs it started.
          # `rpc` runs in the daemon that is already serving.
          "$rel" rpc 'FountainWeb.ApiSpec.spec().paths |> Map.keys() |> Enum.sort() |> Enum.each(&IO.puts/1)' \
            > /tmp/core-paths.txt

          # Guard the guard: a spec with no paths satisfies every "describes no
          # extension" check ever written, which is exactly how the first
          # version of this step passed.
          count=$(wc -l < /tmp/core-paths.txt | tr -d ' ')
          if [ "${count:-0}" -lt 50 ]; then
            echo "::error::the core spec has ${count:-0} paths; the API has far more" >&2
            head -c 2000 /tmp/core-paths.txt >&2 || true
            exit 1
          fi

          for ext in $(ls apps | grep '^fountain_' | sed 's/^fountain_//'); do
            if grep -q "^/api/$ext" /tmp/core-paths.txt; then
              echo "::error::the core spec describes /api/$ext" >&2
              grep "^/api/$ext" /tmp/core-paths.txt >&2
              exit 1
            fi
          done
          echo "no extension path in the core spec ($count paths)"

      # The other direction, from the same compiled tree, so the job proves the
      # switch rather than one setting of it. A release that carried nothing
      # either way would pass every check above.
      - name: The bundled release carries every extension
        env:
          MIX_ENV: prod
          BUNDLE_EXTENSIONS: "true"
        run: |
          set -euo pipefail
          rm -rf _build/prod/rel
          mix release fountain_server
          apps=$(ls _build/prod/rel/fountain_server/lib | sed -E 's/-[0-9.]+$//' | sort)
          for ext in $(ls apps | grep '^fountain_'); do
            echo "$apps" | grep -qx "$ext" || {
              echo "::error::the bundled release is missing $ext" >&2
              exit 1
            }
          done
          echo "every extension application is in the bundled release"

  compose-fresh-clone:
    name: Compose fresh-clone check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Regression guard for #392: compose interpolates the entire file at
      # load time regardless of which service a command targets, so a
      # `:?`-required variable anywhere in it aborted even the documented
      # database-only dev path (`docker compose up -d postgres`) on a fresh
      # clone with no .env. This is the same load step that command runs.
      - name: docker compose config with no .env and no secrets in the environment
        run: env -u SECRET_KEY_BASE -u MASTER_SECRETS_KEY docker compose config --quiet

  # docker-compose.yml and .env.compose.example evolve on main while the
  # image they run stays pinned to a released tag. Every other check pairs
  # main's config with main's code — ComposePassthroughConfigTest evaluates
  # main's runtime.exs, the release boot check boots a fresh build. The
  # pairing a fresh `git clone && docker compose up` actually gets — current
  # compose file, *pinned* image — was exercised by nothing, and both #513
  # boot failures shipped through exactly that gap (#548). So this job runs
  # the documented quick start verbatim against the pin and asks the app
  # what the walkthrough asks.
  compose-pinned-image-boot:
    name: Compose boots the pinned image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # A release bump pins the tag it is about to create, so on the bump PR
      # (and on main until release.yml has published the image) the pin
      # names an image that does not exist yet. That is the one legitimate
      # reason for the pull to fail, and it failed twice at v0.15.0: once on
      # the PR by construction, and once on main, where the red CI run kept
      # build.yml from building the bump commit and prod's footer stayed on
      # the previous version (#1329). When the pin matches the version in
      # mix.exs and the registry has no image for it, this tree is that
      # bump: skip here, and release.yml runs the same script on the tag once
      # the image is up. Any other missing image is a broken quick start.
      - name: Resolve the pinned image
        id: pin
        run: |
          set -euo pipefail
          pin="$(sed -nE 's/^FOUNTAIN_IMAGE_TAG=(v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .env.compose.example)"
          version="$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs | head -1 \
            | sed -E 's/version: "([0-9.]+)"/\1/')"
          echo "pinned ${pin}; mix.exs is ${version}"
          if docker manifest inspect "ghcr.io/managoat/fountain:${pin}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${pin}" = "v${version}" ]; then
            echo "::notice::${pin} has no image yet (release bump); release.yml boots it on the tag"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "the quick start pins ${pin}, which has no image in the registry" >&2
          exit 1

      - name: Run the documented quick start and probe the app
        if: ${{ steps.pin.outputs.exists == 'true' }}
        run: scripts/compose-boot-check.sh

      - name: Dump container logs
        if: ${{ failure() && steps.pin.outputs.exists == 'true' }}
        run: docker compose logs --timestamps

  # Published manuals share links, navigation and a renderer. Contributor-only
  # Markdown needs no Elixir job; manual edits run the documentation suites.
  docs:
    name: Docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [already-tested, changes]
    if: ${{ !cancelled() && needs.already-tested.outputs.skip != 'true'
         && needs.changes.outputs.docs_only == 'true'
         && needs.changes.outputs.manual_docs == 'true' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      # Shares the `test` job's cache keys on purpose. The warning against
      # sharing a key (see the `test` job) is about two jobs racing to save
      # mutually incomplete trees under one name — that cannot happen here,
      # because this job and the partitions are mutually exclusive by
      # construction: docs_only gates one set or the other, never both. Same
      # :test tree, so this job warms from their archive and back into it.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Embedding happens here: a bad snippet path or an unreadable page fails
      # this step, which is the whole reason a docs change cannot skip Elixir
      # entirely.
      - name: Compile
        run: mix compile --warnings-as-errors

      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # docs_test.exs: the docs/nav.yml parser, the snippet-to-Dockerfile COPY
      # coverage, the dialect preprocessing, and every internal /docs link and
      # anchor. Since #1008 it is the whole structural gate — there is no
      # second renderer to build the pages strictly against.
      # docs_controller_test.exs: that the pages actually serve.
      - name: Docs tests
        run: bash scripts/test-docs.sh

      - name: Set up Go
        if: ${{ needs.changes.outputs.cli_docs == 'true' }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # docs/cli.md is diffed against the real command tree, so it is the one
      # docs page whose guard lives in the Go suite rather than the Elixir one.
      #
      # `-count=1` because this job is the reason #1542 exists in miniature:
      # these tests read `docs/cli.md`, a file outside their own package, and
      # this step runs precisely when the docs changed and `cli/` may not have.
      # A cached pass keyed on `cli/go.sum` would be a parity check that never
      # looked at the page it is guarding.
      - name: CLI docs parity
        if: ${{ needs.changes.outputs.cli_docs == 'true' }}
        working-directory: cli
        run: go test -count=1 ./internal/cmd -run 'TestEveryCommandIsDocumented|TestNoDocumentedCommandIsInvented|TestGeneratedCLIReferenceIsCurrent'

  workflow-checks:
    name: CI policy and alert tests
    needs: changes
    # The classifier is intentionally skipped on push. Keep policy checks
    # running there and on classification failure; only explicit docs-only
    # output can skip the alert evaluator below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      # The changelog guard reads the PR's labels.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
          # The changelog guard diffs the PR's merge commit against its
          # first parent, so it needs one level of history; the Swift
          # generation tests read the last release's models from their tag, so
          # they need tags and their trees (#2284).
          fetch-depth: 0
          fetch-tags: true
      - name: Reject conflict markers
        run: python3 scripts/conflict-markers.py
      - name: Test CI decisions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Check the changelog fragments
        # Every fragment under changelog.d/ parses, and [Unreleased] still
        # has the shape the release roll reads (changelog.d/README.md).
        run: python3 scripts/changelog.py check
      - name: Resolve the PR's base
        # HEAD is the merge commit GitHub built against the base branch's
        # tip *at checkout time*. When main moved between the event that
        # started this run and the checkout, that tip is newer than the
        # event's base.sha, and fetching base.sha on its own at depth 1
        # yields a commit that shares no history with HEAD: `base...HEAD`
        # has no merge base and git exits 128. #2163 and #2166 both went
        # red this way within ten minutes of #2164 landing, and a re-run
        # cannot recover because the merge ref moves again. The first
        # parent is the base the merge was actually built against and is
        # always present in a depth-2 checkout. The changelog guard
        # below reads PR_BASE_SHA.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$(git rev-list --parents -n 1 HEAD | wc -w)" -gt 2 ]; then
            BASE_SHA=$(git rev-parse HEAD^1)
          elif ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            git fetch --quiet --depth=1 origin "${BASE_SHA}"
          fi
          echo "PR_BASE_SHA=${BASE_SHA}" >> "$GITHUB_ENV"
      - name: Changelog entries go through changelog.d/
        # A PR does not edit CHANGELOG.md: that file changes once per
        # release, in the release PR, which is what ended the changelog
        # merge conflict every other PR used to hit. The release branch and
        # the release:manual-changelog label (a typo in a shipped entry) are the two
        # doors. pull_request only: the merge group re-tests the same tree,
        # and a push to main has no PR to judge.
        #
        # The labels are read from the API, not the event payload: the
        # payload freezes them at trigger time, so a label added after the
        # push counted for nothing until the next push (#2158 hit this on
        # its own first run). With a live read, re-running this job after
        # labelling is enough.
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r label; do
            if [ -n "${label}" ]; then args+=(--label "${label}"); fi
          done < <(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json labels --jq '.labels[].name')
          python3 scripts/changelog.py guard --base "${PR_BASE_SHA}" --branch "${HEAD_REF}" "${args[@]}"
      # Alert rules, fixtures and executable tooling cannot enter the docs-only
      # plan. Keep their evaluator in the required job on every full plan,
      # including push and dispatch; the standalone workflow is not a gate.
      - name: Install the alert rule evaluator
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y prometheus python3-yaml
      - name: Evaluate shipped alert fixtures
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: /usr/bin/python3 scripts/test-alerts.py

  gate:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - already-tested
      - changes
      - workflow-checks
      - test
      - coverage
      - elixir-static
      - release-and-contract
      - cli-plugins
      - typescript-sdk
      - elixir-sdk
      - python-sdk
      - swift-sdk
      - core-distribution
      - compose-fresh-clone
      - compose-pinned-image-boot
      - docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Every required job passed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/gate.py
      # Only a successful aggregate verdict can publish evidence for main's
      # shortcut. Old runs without this artifact conservatively rerun CI.
      # A merge group publishes too, and that is what keeps main's push at a
      # few seconds once the queue is the thing doing the testing.
      - name: Record the tested tree
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-tree
          path: tested-tree.txt
          if-no-files-found: error
          retention-days: 30
