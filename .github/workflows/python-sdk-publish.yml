name: Publish Python SDK

# PyPI trusted publishing is the only publisher. A push to main that changes
# sdk/python asks PyPI whether its version already exists, then builds and
# publishes only a new one. Configure the PyPI project for this repository,
# this workflow filename, and the `pypi` environment before the first release.

on:
  push:
    branches: [main]
    paths:
      - "sdk/python/**"
      - "scripts/sdk-release-tag.py"
  workflow_dispatch:

concurrency:
  group: pypi-fountain-sdk-publish
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    name: Publish to PyPI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: write
      # Read prior attempts to prove which source actually uploaded a release.
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.9"

      - name: Read release state
        id: release
        working-directory: sdk/python
        run: |
          if python -c 'import tomllib' 2>/dev/null; then
            version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          else
            version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/fountain-agent-sdk/${version}/json")
          case "$code" in
            200) needed=no; published=true ;;
            404) needed=yes; published=false ;;
            *) echo "PyPI version check returned HTTP $code" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
          echo "fountain-agent-sdk $version already on PyPI: $published"

      - name: Test
        if: steps.release.outputs.needed == 'yes'
        run: python -m unittest discover -s sdk/python/tests -v

      - name: Build
        if: steps.release.outputs.needed == 'yes'
        run: |
          python -m pip install --disable-pip-version-check build
          python -m build sdk/python

      - name: Publish
        if: steps.release.outputs.needed == 'yes'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: sdk/python/dist/

      # A rerun can finish an interrupted tag write without uploading twice.
      - name: Record the release as a tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          NEEDED: ${{ steps.release.outputs.needed }}
        run: |
          flags=()
          if [ "$NEEDED" = yes ]; then flags+=(--published-now); fi
          python3 scripts/sdk-release-tag.py python "$VERSION" "${flags[@]}"

      - name: Say what happened
        env:
          VERSION: ${{ steps.release.outputs.version }}
          NEEDED: ${{ steps.release.outputs.needed }}
        run: |
          if [ "$NEEDED" = yes ]; then
            echo "Published fountain-agent-sdk $VERSION to PyPI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "fountain-agent-sdk $VERSION is already on PyPI; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
