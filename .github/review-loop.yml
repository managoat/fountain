# Four independent whole-PR reviews, safe fixes, verified re-review, then approval, changes requested, or an explicit human decision.
version: 1
reviewers:
  - id: qa-team
    runtime: codex
    model: openai/gpt-6-astra
    instructions: .github/review/correctness.md
    setup: .github/review/reviewer-setup.sh
    setup_timeout_minutes: 15
  - id: security-audit
    runtime: codex
    model: openai/gpt-6-astra
    instructions: .github/review/tenant-isolation.md
    setup: .github/review/reviewer-setup.sh
    setup_timeout_minutes: 15
  - id: product-api
    runtime: claude
    model: anthropic/opus
    instructions: .github/review/api-compatibility.md
    setup: .github/review/reviewer-setup.sh
    setup_timeout_minutes: 15
  - id: xp-reviewer
    runtime: claude
    model: anthropic/opus
    instructions: .github/review/simplicity.md
    setup: .github/review/reviewer-setup.sh
    setup_timeout_minutes: 15
triage:
  blocking_severity: medium
  accept_nonblocking: true
fixes:
  mode: automatic
  signoff: github-app
  allowed_paths:
    - apps/**
    - ee/**
    - cli/**
    - sdk/**
    - docs/**
  excluded_paths:
    - "**/mix.exs"
    - "**/mix.lock"
    - "**/package.json"
    - "**/package-lock.json"
    - "**/go.mod"
    - "**/go.sum"
    - "**/migrations/**"
    - "**/LICENSE*"
    - sdk/contract/manifests/**
    - sdk/contract/omissions.json
    - sdk/conformance/matrix.json
    - "**/pyproject.toml"
    - "**/uv.lock"
  # Allow a small repair to include its regression test and supporting fixture.
  max_files: 3
  max_bytes: 256000
verification:
  instructions: .github/review/verification.md
  setup: .github/review/setup.sh
  required_checks: []
  required_workflows:
    - path: .github/workflows/alert-rules.yml
      paths:
        - deploy/k8s/prometheusrule.yaml
        - scripts/test-alerts.py
        - .github/workflows/alert-rules.yml
    - path: .github/workflows/ci.yml
    - path: .github/workflows/decisions.yml
      paths:
        - decisions/**
        - scripts/decisions-index.sh
        - .github/workflows/decisions.yml
    - path: .github/workflows/elixir-sdk-release-gate.yml
      paths:
        - sdk/elixir/**
        - scripts/elixir-sdk-release.exs
        - .github/workflows/elixir-sdk-release-gate.yml
    - path: .github/workflows/python-sdk-release-gate.yml
      paths:
        - sdk/python/**
        - .github/workflows/python-sdk-release-gate.yml
        - scripts/sdk-release.py
        - scripts/sdk-catalog.py
    - path: .github/workflows/sandbox-images.yml
      paths:
        - images/**
        - scripts/sandbox-image/**
        - .github/workflows/sandbox-images.yml
    - path: .github/workflows/sdk-release-gate.yml
      paths:
        - sdk/typescript/**
        - scripts/sdk-release.mjs
        - scripts/sdk-publish-tag*.mjs
        - .github/workflows/sdk-publish.yml
        - .github/workflows/sdk-release-gate.yml
    - path: .github/workflows/swift-sdk-release-gate.yml
      paths:
        - sdk/swift/**
        - Package.swift
        - scripts/sdk-release.py
        - scripts/sdk-catalog.py
        - .github/workflows/swift-sdk-release-gate.yml
        - .github/workflows/swift-sdk-publish.yml
    - path: .github/workflows/secrets-scan.yml
  # Cold Credo/Dialyzer took ~23 minutes on the measured fresh worker.
  command_timeout_minutes: 30
  commands:
    # Clean-checkout lockfile guard; && preserves each stage's failure.
    - rl-env sh -c 'mix deps.get && mix deps.unlock --unused && git diff --exit-code -- mix.lock'
    - rl-env mix format --check-formatted
    # Assemble prod as precommit does. Plain deps.get preserves test/dev deps.
    - rl-env sh -c 'mix compile --warnings-as-errors && MIX_ENV=prod mix deps.get && MIX_ENV=prod mix
      release fountain_server --overwrite'
    - rl-env sh -c 'mix ecto.create --quiet && mix ecto.migrate --quiet'
    - rl-env env MIX_TEST_PARTITION=1 bash scripts/test-partition.sh 6
    - rl-env env MIX_TEST_PARTITION=2 bash scripts/test-partition.sh 6
    - rl-env env MIX_TEST_PARTITION=3 bash scripts/test-partition.sh 6
    - rl-env env MIX_TEST_PARTITION=4 bash scripts/test-partition.sh 6
    - rl-env env MIX_TEST_PARTITION=5 bash scripts/test-partition.sh 6
    - rl-env env MIX_TEST_PARTITION=6 bash scripts/test-partition.sh 6
    # Root tests share one VM and catch cross-app config leaks missed by partitions.
    - rl-env sh -c 'bash scripts/test-libraries.sh && mix test'
    - rl-env sh -c 'mix credo --strict && MIX_ENV=dev mix dialyzer'
    - rl-env elixir scripts/hex-audit-gate.exs
    - rl-env bash scripts/sobelow.sh
    - rl-env bash scripts/sdk-contract/build.sh --check
    - rl-env sh -c 'cd sdk/typescript && npm ci --no-audit --no-fund && npm run typecheck && npm test && npm
      run build && npm run verify-contract && npm run conformance'
    - rl-env sh -c 'cd cli && go test -count=1 ./... && go vet ./...'
    - rl-env sh -c 'cd apps/fountain_buzz/cli && go test -count=1 ./... && go vet ./...'
    - rl-env sh -c 'python3 sdk/conformance/lint.py && python3 -m unittest discover -s sdk/python/tests -v &&
      python3 -m unittest discover -s integrations/hermes/tests -v && cd sdk/python && python3
      scripts/verify_contract.py'
    - rl-env sh -c 'cd sdk/elixir && mix deps.get && mix format --check-formatted && mix compile
      --warnings-as-errors && mix test'
approval:
  mode: policy-pass-with-exceptions
  require_all_reviewers: true
  require_independent_rereview: true
  human_review_when:
    - unresolved_human_objection
    - reviewer_requests_product_decision
  # A path here sends the PR to a maintainer even when all four reviewers
  # are satisfied and every check passed, so it is reserved for the places
  # where a wrong automatic approval is hard to undo or would weaken the
  # gates themselves: this policy and the instructions it names, workflows
  # (they run with repository secrets), migrations, licensing, the release
  # and deployment definitions, the SDK version files whose merge publishes
  # a package, the files that set a gate's threshold or scope, and the ADRs,
  # because a PR that changes a recorded decision is the one thing the
  # maintainer always wants to see (the reviewers escalate a PR that
  # contradicts one without editing it). Source, tests, docs, config,
  # dependency bumps and the other scripts are what the reviewers and the
  # verification recipe exist to judge; listing them here sent every one of
  # the first eleven runs to a human.
  human_review_paths:
    - .github/review-loop.yml
    - .github/review/**
    - .github/workflows/**
    - "**/migrations/**"
    - "**/LICENSE*"
    - NOTICE
    - Dockerfile
    - rel/**
    - deploy/**
    - sdk/typescript/package.json
    - sdk/python/pyproject.toml
    - sdk/elixir/mix.exs
    - sdk/swift/version.json
    - coverage.exs
    - .credo.exs
    - "**/.sobelow-conf"
    - scripts/coverage-gate.exs
    - scripts/hex-audit-gate.exs
    - scripts/sobelow.sh
    - scripts/test-partition.sh
    - scripts/test-libraries.sh
    - decisions/**
  human_review_label: needs:human-review
limits:
  max_fix_rounds: 3
  max_elapsed_minutes: 120
  max_parallel_reviewers: 4
  max_agent_tasks: 30
  max_reported_tokens: 50000000
