name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # PR updates supersede one another. Main commits validate independently: a
  # shared main group both delayed feedback and cancelled older pending runs.
  # build.yml's built-ancestor diff includes changes from any unbuilt
  # ancestor.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Independent jobs keep feedback near the slowest test partition plus coverage.
# Six partitions share a :test cache; static analysis and the release use their
# own build caches. Postgres starts alongside toolchain setup.
#
# CI required verifies the selected plan, including intentional skips. Main
# always runs the complete suite. The manual's render, internal links,
# snippets, anchors (the `site` job) and CLI reference parity remain blocking.
#
# The one Postgres pin. Jobs start it in the background before they need it.
env:
  PG_IMAGE: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb

jobs:
  changes:
    name: Classify documentation changes
    # Never on push: main runs everything. Skipped means empty outputs, and
    # the `!= 'true'` tests below let every job run.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    permissions:
      contents: read

    outputs:
      docs_only: ${{ steps.filter.outputs.docs_only }}
      manual_docs: ${{ steps.filter.outputs.manual_docs }}
      cli_docs: ${{ steps.filter.outputs.cli_docs }}
      site: ${{ steps.filter.outputs.site }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Classify the diff
        id: filter
        # Unknown paths, failed diffs and manual dispatch select the full
        # server plan.
        run: |
          set -u
          base=""
          decide() {
            echo "diff_base=${base:-}" >> "$GITHUB_OUTPUT"
            python3 scripts/ci/changes.py "${base:-}" >> "$GITHUB_OUTPUT"
            exit "$?"
          }

          # A manual run requests complete validation, without a diff
          # shortcut.
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            decide
          fi

          if ! git fetch --no-tags --quiet origin \
               "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}" 2>/dev/null; then
            echo "could not fetch base ${GITHUB_BASE_REF} — running the full CI"
            decide
          fi

          base="$(git merge-base "refs/remotes/origin/${GITHUB_BASE_REF}" HEAD 2>/dev/null || true)"
          if [ -z "${base}" ]; then
            echo "no merge base with ${GITHUB_BASE_REF} — running the full CI"
            decide
          fi

          decide

  test:
    name: Build and Test (partition ${{ matrix.partition }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: changes
    # `!cancelled()` rather than the implicit success(): on push the
    # classifier is skipped, and a skipped `needs` would skip this job too.
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    strategy:
      # Each partition is an independent verdict and all six are wanted: a
      # cancelled sibling would leave the coverage merge without its export and
      # turn one test failure into two unrelated-looking ones.
      fail-fast: false
      matrix:
        # The single source of truth for how many partitions there are — the
        # `--partitions` argument below is `strategy.job-total`, so adding an
        # entry here is the whole change.
        #
        # Balance measured work before increasing the runner count.
        partition: [1, 2, 3, 4, 5, 6]

    outputs:
      # Same value from every partition, so which one wins the race to set it
      # does not matter. The coverage job uses it to check that it merged an
      # export from every partition rather than from whichever ones uploaded.
      partitions: ${{ steps.total.outputs.count }}

    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      - name: Mix lock backport preserves port reuse and cross-VM exclusion
        if: ${{ matrix.partition == 1 }}
        run: elixir scripts/ci/mix-lock-backport-test.exs

      - name: Timing collection preserves ExUnit execution
        if: ${{ matrix.partition == 1 }}
        run: elixir scripts/ci/timing-formatter-test.exs

      - name: Mix stall diagnostics capture lock holders and waiters
        if: ${{ matrix.partition == 1 }}
        run: elixir scripts/ci/mix-diagnostics-test.exs

      # Cache keys carry the job name. `test`, `elixir-static` and
      # `release-and-contract` build different trees — this one only ever
      # compiles :test, while `elixir-static` also builds :dev for dialyzer and
      # `release-and-contract` builds :prod for the release — and a shared key
      # would have them racing to save mutually incomplete archives under it,
      # winner decided by whichever finished first. Same reasoning as the
      # deliberately-narrow restore-keys below: a cache whose contents depend
      # on who got there first is the failure mode being avoided.
      #
      # The partitions DO share a key, and that is not the same race:
      # they compile one identical :test tree and differ only in which test
      # files they load, so whichever wins the save has saved the same archive
      # the others would have. Giving each partition its own key would multiply
      # the storage for identical content and stop them warming each other.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-test-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback: BEAM bytecode compiled by a different
          # OTP/Elixir is rebuilt from scratch anyway, and a cross-version
          # restore has produced subtle staleness — the same hazard the PLT
          # cache in `elixir-static` avoids by omitting restore-keys entirely.
          restore-keys: |
            ${{ runner.os }}-build-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        # #1997 stalled inside Mix before tests began. Capture the live lock
        # holders and process tree before the unchanged job timeout cancels it.
        env:
          MIX_DIAGNOSTICS: "1"
        run: |
          elixir -r scripts/ci/mix-diagnostics.exs -S mix ecto.create --quiet
          elixir -r scripts/ci/mix-diagnostics.exs -S mix ecto.migrate --quiet

      # Coverage instrumentation is free here — measured at 128.8s with cover
      # against 128.6s without, on the same machine. Running the suite bare on
      # PRs and gating coverage elsewhere would buy nothing and cost the gate.
      #
      # The script exists for the assertion, not for the mix invocation: with
      # partitioning, "ran zero tests" and "passed" are both exit 0, so it
      # parses ExUnit's summary line and refuses to succeed without one. See
      # the header of scripts/test-partition.sh.
      - name: Run tests with coverage
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}
        run: scripts/test-partition.sh ${{ strategy.job-total }}

      - name: Publish the partition count
        id: total
        run: echo "count=${{ strategy.job-total }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage export
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverdata-${{ matrix.partition }}
          path: |
            apps/fountain/cover/${{ matrix.partition }}.coverdata
            apps/fountain/cover/${{ matrix.partition }}.tests
            apps/fountain/cover/${{ matrix.partition }}.timings.log
          # An export that silently fails to upload would leave the merge job
          # gating on a fraction of the suite while still printing a number.
          if-no-files-found: error
          retention-days: 1

  # The 85% gate, enforced once against every partition's data. It is a
  # separate job because there is nowhere else it can live: no partition can
  # see the others' coverage, and ExCoveralls — which this replaced in #620 —
  # had no way to merge across machines at all. Elixir's built-in cover does,
  # via the exports `mix test --partitions` writes.
  #
  # Deliberately light: checkout, Elixir setup, artifact download and a merge.
  # The plain Elixir script needs no database, dependencies or compiled app.
  coverage:
    name: Coverage gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: test
    # Still "after a green suite" — but spelled out, because test is skipped
    # (not failed) on a docs-only plan and must not drag this along.
    if: ${{ !cancelled() && needs.test.result == 'success' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      - name: Download coverage exports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverdata-*
          merge-multiple: true
          path: apps/fountain/cover

      # `mix test.coverage` reports on whatever exports it finds and says
      # nothing about the ones it did not. Two partitions' data would produce a
      # real-looking table with a number nobody could interpret, so the count
      # is checked before the threshold is trusted. Summing the per-partition
      # test counts is the same check from the other side, and puts the size of
      # the suite the gate stood on into the log.
      - name: Check every partition reported
        run: |
          set -euo pipefail
          shopt -s nullglob
          expected=${{ needs.test.outputs.partitions }}
          exports=(apps/fountain/cover/[0-9]*.coverdata)
          if [ "${#exports[@]}" -ne "$expected" ]; then
            echo "merged ${#exports[@]} coverage exports, expected $expected" >&2
            exit 1
          fi
          total=$(cat apps/fountain/cover/*.tests | awk '{s += $1} END {print s + 0}')
          echo "merging ${#exports[@]} partitions covering $total tests"

      # Not `mix test.coverage`: ~90% of that task's time is rendering an
      # HTML report — 530 files, 129MB — that this job never opens, since all
      # it does is assert a threshold and exit. The script computes the same
      # number from the same coverage.exs (verified identical, 85.46% both, on
      # the same six exports), and prints the least-covered modules so a
      # failure still says where to look.
      #
      # `elixir`, not `mix run`: the script reads .coverdata and coverage.exs
      # and touches nothing else, so it needs no deps, no _build and no
      # compile. Through `mix run` this step spent most of its time
      # recompiling the app for a script that never calls it ("Compiling 10
      # files" for a 12s step). That is also why this job no longer restores
      # the deps/build caches or runs deps.get.
      #
      # Run `mix test.coverage` locally for the full table and the HTML.
      - name: Enforce the coverage threshold
        run: elixir scripts/coverage-gate.exs

  elixir-static:
    name: Elixir static analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    env:
      MIX_ENV: test

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      # Job-scoped keys — see the note in `test`.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-static-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-static-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-static-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback, for the reason given in `test`.
          restore-keys: |
            ${{ runner.os }}-build-static-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Check for unused dependencies
        run: mix deps.unlock --unused && git diff --exit-code mix.lock

      - name: Check formatting
        run: mix format --check-formatted

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      # --strict, matching `mix precommit`. CI used to run the default profile
      # while precommit ran --strict, so a strict violation passed CI and only
      # showed up for whoever ran precommit next.
      - name: Run Credo
        run: mix credo --strict

      - name: Audit dependencies
        # Security advisories block the build unless explicitly acknowledged in
        # mix.exs. Retirements stay visible without breaking unrelated work: an
        # upstream maintainer can retire a package at any moment.
        run: elixir scripts/hex-audit-gate.exs

      # Not plain `mix sobelow`: at the umbrella root sobelow detects no
      # Phoenix app, scans nothing, and exits 0 — indistinguishable from a
      # pass (#194, #311). The script runs it from apps/fountain.
      - name: Security scan (sobelow)
        run: scripts/sobelow.sh

      # The PLT encodes OTP + deps; rebuilding it cold takes minutes, so it is
      # cached on the exact beam versions + lockfile. mix.exs pins its path to
      # priv/plts for this cache. restore-keys deliberately omitted: a PLT from
      # different versions would be rebuilt anyway.
      - name: Restore dialyzer PLT cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}

      # MIX_ENV=dev on purpose (the job env is test): dialyzer analyzes the
      # shipped code; the test env would drag test/support and test-only deps
      # into the analysis and the PLT.
      - name: Dialyzer
        run: MIX_ENV=dev mix dialyzer --format github

  release-and-contract:
    name: Release boot and the API contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    # Postgres is here for the release boot check: /health/ready calls
    # Fountain.Health.database/0, and the release task that runs after it
    # queries users. Both need a migrated fountain_test to answer honestly.
    # `mix openapi.export` and `mix openapi.spec.json` boot the app too, which
    # is why the contract steps are in this job rather than beside the clients
    # that consume what they produce.
    env:
      MIX_ENV: test

    steps:
      # Postgres as a backgrounded step rather than a `services:` container.
      # A service container is initialised before the first step runs, so all
      # ~27s of it sat on the critical path of every job wanting a database:
      # ~11.7s pulling the image, ~2s creating the container, then ~13.3s
      # waiting on a health probe whose first poll does not fire for 10s.
      # Started here it pulls and initialises alongside checkout, setup-beam,
      # the cache restores and deps.get — work that has to happen anyway — and
      # the wait below normally returns on its first poll.
      #
      # Nothing here tunes Postgres for throughput, and that is deliberate.
      # The suite runs in Ecto's SQL Sandbox: every test is a transaction that
      # gets rolled back, so almost nothing is committed or fsynced. A tmpfs
      # PGDATA measured 58.8s against 57.8s on disk for one partition despite
      # seven times the pgbench write throughput. Init was the only real cost.
      - name: Start Postgres in the background
        run: |
          set -euo pipefail
          nohup docker run -d --name postgres \
            -p 5432:5432 \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=postgres \
            -e POSTGRES_DB=fountain_test \
            "${PG_IMAGE}" > "${RUNNER_TEMP}/postgres-start.log" 2>&1 &
          echo "postgres starting; the wait step is what decides"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Backport the pinned Mix lock fix
        run: scripts/ci/mix-lock-backport.sh --install

      # Job-scoped keys — see the note in `test`.
      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-release-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-release-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-release-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          # No bare "-build-" fallback, for the reason given in `test`.
          restore-keys: |
            ${{ runner.os }}-build-release-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - name: Install dependencies
        run: mix deps.get

      # For the release boot check below, not for a test suite — this job runs
      # none. /health/ready and the release task below both read the database.
      # Idempotent on purpose. The start above is backgrounded, and a step can
      # finish before the pull it launched does; if the container is not there
      # yet this starts it synchronously. Slower in that case, never wrong.
      - name: Wait for Postgres
        run: |
          set -uo pipefail
          if ! docker inspect postgres > /dev/null 2>&1; then
            echo "background start had not created the container; starting it here"
            cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
            docker run -d --name postgres \
              -p 5432:5432 \
              -e POSTGRES_USER=postgres \
              -e POSTGRES_PASSWORD=postgres \
              -e POSTGRES_DB=fountain_test \
              "${PG_IMAGE}" || true
          fi
          for _ in $(seq 1 120); do
            if docker exec postgres pg_isready -U postgres -q 2>/dev/null; then
              echo "postgres ready"
              exit 0
            fi
            sleep 0.5
          done
          echo "::error::postgres never became ready"
          cat "${RUNNER_TEMP}/postgres-start.log" 2>/dev/null || true
          docker logs postgres 2>&1 | tail -50 || true
          exit 1

      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # Builds a release and runs its config providers. Config.Reader tests
      # validate config *values*; only a real boot catches a key that may not be
      # set at runtime at all. A `force_ssl` moved into runtime.exs passed every
      # test and then CrashLoopBackOff'd every pod with:
      #   ERROR! the application :fountain has a different value set for path
      #   [:force_ssl] inside key FountainWeb.Endpoint during runtime compared
      #   to compile time.
      # Two distinct failures have shipped past every other check here, one
      # after the other, from the same change:
      #
      #   1. force_ssl set from runtime.exs failed validate_compile_env and the
      #      node aborted during boot.
      #   2. the node then booted fine and Plug.SSL 301'd every kubelet probe,
      #      so no pod ever became ready.
      #
      # From outside they look identical — pods not Ready, rollout stalled — and
      # neither is visible to a Config.Reader test or to `mix test`. So this
      # boots a real release with production-shaped config and then asks it the
      # questions kubelet asks: over plain http, on the pod's own port, with no
      # proxy and no X-Forwarded-Proto.
      #
      # The Host header matters more than the address. Plug.SSL's default
      # exclude is [hosts: ["localhost", "127.0.0.1"]], so a probe sent to
      # either name is never redirected and this check would pass while
      # production 301s. kubelet dials the pod IP, which is in neither list, so
      # the probe carries a pod-shaped Host to reproduce that.
      - name: Release boots and answers its health probes
        env:
          MIX_ENV: prod
          PHX_SERVER: "true"
          PORT: "4000"
          SECRET_KEY_BASE: ci-only-not-a-secret-000000000000000000000000000000000000000000000000
          # 43 chars of base64url = 32 zero bytes. Valid format, obviously not a key.
          MASTER_SECRETS_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
          DATABASE_URL: postgres://postgres:postgres@localhost/fountain_test
          # The CI Postgres service serves no TLS, and DATABASE_SSL defaults on
          # in prod — without this the release dies on a connection timeout and
          # the step fails for a reason that has nothing to do with the app.
          DATABASE_SSL: "false"
          PUBLIC_URL: https://ci.example.com
          # Required at boot: every conversation is brokered (ADR 0019). The
          # readiness probe below fails if the listener is not up.
          BROKER_LISTEN_PORT: "14322"
          BROKER_PROXY_URL: https://broker.ci.example.com:443
          # No collector on a runner; without this the exporter retries per span.
          OTEL_TRACES_EXPORTER: none
        run: |
          set -euo pipefail
          mix deps.get --only prod
          mix release fountain_server --overwrite

          # Config providers run here. A key that may not be set at runtime
          # aborts boot at this point rather than serving anything.
          _build/prod/rel/fountain_server/bin/fountain_server eval 'IO.puts("config ok")'

          _build/prod/rel/fountain_server/bin/fountain_server daemon
          trap '_build/prod/rel/fountain_server/bin/fountain_server stop || true' EXIT

          probe() {
            # Exactly, not "2xx or 3xx". A 301 is what broke production: curl
            # -f does not fail on a redirect, so the status has to be compared.
            for _ in $(seq 1 45); do
              code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: 10.42.0.1' "http://127.0.0.1:4000$1") || code=000
              if [ "$code" = "200" ]; then
                echo "  $1 -> 200"
                return 0
              fi
              if [ "$code" != "000" ] && [ "$code" != "502" ]; then
                echo "  $1 -> $code (expected 200)" >&2
                return 1
              fi
              sleep 2
            done
            echo "  $1 never answered" >&2
            return 1
          }

          probe /health
          probe /health/ready

          # Release tasks must be runnable while the server owns the ports,
          # and without PHX_SERVER — the shape they actually run in, both
          # in-pod and via compose exec. A release task once booted the
          # entire app from eval and died on eaddrinuse against a running
          # server; with PHX_SERVER=false the repo had no config at all.
          # Both regressions fail exactly here.
          echo "release task runs beside the live server:"
          PHX_SERVER=false _build/prod/rel/fountain_server/bin/fountain_server \
            eval 'Fountain.Release.migrate()'

      - name: Validate OpenAPI spec
        run: mix openapi.spec.json --spec FountainWeb.ApiSpec --output /tmp/openapi.json && jq empty /tmp/openapi.json

      # One API and one generated SDK (#1411, ADR 0059). The server's OpenAPI
      # document is the only description of the wire, and the SDK's
      # generated types are the only thing derived from it.
      - name: Export the OpenAPI document
        run: python3 scripts/sdk-contract/generate.py --export-only

      # The TypeScript SDK (sdk/typescript). Node runs the .ts sources
      # directly, so `npm test` needs nothing but the dev dependency on tsc —
      # which is also what enforces `erasableSyntaxOnly`, the setting that
      # keeps those sources runnable without a build step.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      # `--no-audit --no-fund`: see the typescript-sdk job, which carries the
      # measurement. Here it is only to make `npm run generate` runnable.
      - name: SDK install
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund

      # The TypeScript SDK's types are generated from that spec, not written by
      # hand, so a schema change in Elixir must reach
      # `sdk/typescript/src/generated`. Regenerating here and failing on a diff
      # is what keeps them the same thing rather than two descriptions of the
      # API that drift apart.
      - name: SDK types match the spec
        run: python3 scripts/sdk-contract/generate.py --skip-export --check

  typescript-sdk:
    name: TypeScript SDK (${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        node: ["20.19.0", "24"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Node 24 runs the TypeScript test sources directly. The minimum
      # runtime runs JavaScript compiled from those same tests. Both legs
      # typecheck and build the SDK and its browser bundle.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json

      - name: Account app tests
        run: node --test account/test/*.test.mjs

      - name: Account app browser checks
        if: ${{ matrix.node == '24' }}
        run: |
          npm ci --prefix account --no-audit --no-fund
          account/node_modules/.bin/playwright install --with-deps chromium
          npm --prefix account run test:browser

      # `--no-audit` is the whole reason this step is not the longest in CI.
      # `npm ci` runs a vulnerability audit by default, which is one POST to
      # registry.npmjs.org/-/npm/v1/security/advisories/bulk — and that request
      # stalls from Actions runners rather than failing fast. Measured on this
      # lockfile: 35 packages, every tarball fetched in 325ms from a warm
      # cache, and then `reify:audit Completed in 300202ms`. The step was
      # taking 88s to 302s depending on how far into npm's 5-minute timeout the
      # request got, on every PR, and it made this job 426s against 171s for
      # the slowest test partition. With the flag it is under 5s.
      #
      # Nothing is lost, because nothing was gated: `npm ci` does not fail on
      # advisories, so this could only ever print "found 0 vulnerabilities"
      # into a log. What DOES watch these packages is dependabot, which was
      # given its npm ecosystem in the same change that added this flag --
      # before that the audit line was the only npm advisory signal in the
      # repository, and it was one nobody could act on. `--no-fund` suppresses
      # the funding notice for the same reason: it is output, not a check.
      - name: SDK install
        working-directory: sdk/typescript
        run: npm ci --no-audit --no-fund

      - name: SDK typecheck
        working-directory: sdk/typescript
        run: npm run typecheck

      - name: SDK tests on the minimum runtime
        if: ${{ matrix.node == '20.19.0' }}
        working-directory: sdk/typescript
        run: node scripts/test-compiled.mjs

      - name: SDK tests
        if: ${{ matrix.node == '24' }}
        working-directory: sdk/typescript
        run: npm test

      - name: SDK build
        working-directory: sdk/typescript
        run: npm run build

      # Eleven browser applications are built on this API, so the SDK's default
      # entry has to bundle for a browser — no Node built-ins reachable from it.
      - name: SDK bundles for the browser
        working-directory: sdk/typescript
        run: npx --yes esbuild dist/index.js --bundle --platform=browser --format=esm --outfile=/dev/null

      - name: SDK packed artifact
        working-directory: sdk/typescript
        run: node scripts/verify-package.mjs

  cli:
    name: CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    # The Go CLI has no dependency on an SDK build.
    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # The CLI had tests since launch that no workflow ever ran, so they gated
      # neither a merge nor a release.
      #
      # `-count=1` disables Go's test cache, and it is load-bearing rather than
      # belt-and-braces (#1542). `TestExamplesParse` reads its inputs from
      # `examples/`, outside its own package, so Go has no reliable way to know
      # those inputs moved — and `setup-go`'s cache is keyed on `cli/go.sum`,
      # which does not move when an example changes. Go caches only successes,
      # so the stale entry it kept serving was a pass from before the example
      # that broke it existed: CI reported `ok (cached)` for a day while a
      # fresh run failed. The suite takes about two seconds; a cache that can
      # report green for a red tree is not worth that.
      - name: CLI tests
        working-directory: cli
        run: go test -count=1 ./...

      - name: CLI vet
        working-directory: cli
        run: go vet ./...

      # `gofmt -l` prints offending files and exits 0, so the failure has to
      # come from the emptiness check — print the list first so the log says
      # which files to run gofmt on.
      - name: CLI gofmt
        run: |
          unformatted=$(gofmt -l cli)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

  compose-fresh-clone:
    name: Compose fresh-clone check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # Regression guard for #392: compose interpolates the entire file at
      # load time regardless of which service a command targets, so a
      # `:?`-required variable anywhere in it aborted even the documented
      # database-only dev path (`docker compose up -d postgres`) on a fresh
      # clone with no .env. This is the same load step that command runs.
      - name: docker compose config with no .env and no secrets in the environment
        run: env -u SECRET_KEY_BASE -u MASTER_SECRETS_KEY docker compose config --quiet

  # docker-compose.yml and .env.compose.example evolve on main while the
  # image they run stays pinned to a released tag. Every other check pairs
  # main's config with main's code — ComposePassthroughConfigTest evaluates
  # main's runtime.exs, the release boot check boots a fresh build. The
  # pairing a fresh `git clone && docker compose up` actually gets — current
  # compose file, *pinned* image — was exercised by nothing, and both #513
  # boot failures shipped through exactly that gap (#548). So this job runs
  # the documented quick start verbatim against the pin and asks the app
  # what the walkthrough asks.
  compose-pinned-image-boot:
    name: Compose boots the pinned image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only != 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      # A release bump pins the tag it is about to create, so on main until
      # release.yml has published the image the pin names an image that does
      # not exist yet. That is the one legitimate
      # reason for the pull to fail, and it failed twice at v0.15.0: once on
      # the PR by construction, and once on main, where the red CI run kept
      # build.yml from building the bump commit and prod's footer stayed on
      # the previous version (#1329). When the pin matches the version in
      # mix.exs and the registry has no image for it, this tree is that
      # bump: skip here, and release.yml runs the same script on the tag once
      # the image is up. Any other missing image is a broken quick start.
      - name: Resolve the pinned image
        id: pin
        run: |
          set -euo pipefail
          pin="$(sed -nE 's/^MANAGOAT_IMAGE_TAG=(v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .env.compose.example)"
          version="$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs | head -1 \
            | sed -E 's/version: "([0-9.]+)"/\1/')"
          echo "pinned ${pin}; mix.exs is ${version}"
          if docker manifest inspect "ghcr.io/managoat/managoat:${pin}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${pin}" = "v${version}" ]; then
            echo "::notice::${pin} has no image yet (release bump); release.yml boots it on the tag"
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "the quick start pins ${pin}, which has no image in the registry" >&2
          exit 1

      - name: Run the documented quick start and probe the app
        if: ${{ steps.pin.outputs.exists == 'true' }}
        run: scripts/compose-boot-check.sh

      - name: Dump container logs
        if: ${{ failure() && steps.pin.outputs.exists == 'true' }}
        run: docker compose logs --timestamps

  # The managoat.com pages and the manual in site/: a Mix project of its own
  # that renders static HTML (ADR 0034, decisions/0081). Its tests are the
  # manual's whole structural gate: nav, links, anchors, snippets, fenced
  # languages, the search index and the llms.txt files. Selected by the
  # classifier's `site` output (site/, docs/, the files the manual includes,
  # the toolchain pin, this file or site.yml), so a server-only PR skips it and
  # CI required accepts the skip; push and dispatch always run it. On a push to
  # main that touched what it renders it hands the render to `site-publish`,
  # which therefore publishes only what these tests passed.
  site:
    name: Site test and render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.site != 'false' }}

    permissions:
      contents: read

    outputs:
      publish: ${{ steps.publish.outputs.publish }}

    defaults:
      run:
        working-directory: site

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # The parent, for the publish decision below.
          fetch-depth: 2
          persist-credentials: false

      # A push to main publishes only when it moved what the image or the
      # manifests are made of: site/, the manual and the files its pages
      # include (scripts/ci/changes.py's MANUAL_SOURCES that are rendered),
      # the toolchain pin or site.yml. A push that moved only README.md or
      # the alert rules still runs the tests here but builds nothing. An
      # unreadable `before` (a new branch, a force push) publishes, and so
      # does a dispatch on main, which has no `before`: that is the way to
      # republish by hand.
      - name: Decide whether this push publishes
        id: publish
        if: ${{ github.ref == 'refs/heads/main'
             && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        working-directory: .
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          publish=true
          if [[ "${BEFORE}" =~ ^[0-9a-f]{40}$ ]] && [ "${BEFORE}" != "0000000000000000000000000000000000000000" ] \
             && { git cat-file -e "${BEFORE}^{commit}" 2>/dev/null \
                  || git fetch --no-tags --quiet --depth=1 origin "${BEFORE}" 2>/dev/null; } \
             && git diff --quiet "${BEFORE}" HEAD -- site docs \
                  apps/fountain/priv/first_request sdk/typescript/examples \
                  .tool-versions .github/workflows/site.yml; then
            publish=false
          fi
          echo "publish=${publish}"
          echo "publish=${publish}" >> "$GITHUB_OUTPUT"

      # The repo's one toolchain pin.
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            site/deps
            site/_build
          key: ${{ runner.os }}-site-mix-${{ hashFiles('.tool-versions', 'site/mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # The site's link check and the manual's structural and content tests.
      # Rendering highlights every fence, so a fence whose parser cannot load
      # fails here, and again in the build below.
      - run: mix test
      - run: mix site.build

      # The config nginx will actually load, tested by nginx: a directive it
      # rejects is a container that never starts.
      - name: nginx accepts the config
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

      - name: The manifests build
        run: kubectl kustomize k8s > /dev/null

      - name: Keep the render for the image
        if: ${{ steps.publish.outputs.publish == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 1

  # Not a gate: it runs after `site` on main and builds the image and
  # publishes the manifests Flux deploys (site.yml). CI required does not wait
  # for it. `!cancelled()` is load-bearing: without a status function the
  # condition is ANDed with success(), which is false on push because
  # `changes`, an ancestor through `site`, is skipped there.
  site-publish:
    name: Site publish
    needs: site
    if: ${{ !cancelled() && needs.site.result == 'success'
         && needs.site.outputs.publish == 'true' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/site.yml
    secrets:
      FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}

  # The manual is rendered and tested by the `site` job (decisions/0081), with
  # no Postgres and no server compile. What is left here is the one manual
  # check that lives in the Go suite: docs/cli.md and docs/cli/ against the
  # real command tree, on a docs-only plan that touched them. A full plan runs
  # the same tests in `cli`.
  docs:
    name: Docs (CLI reference parity)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.docs_only == 'true'
         && needs.changes.outputs.cli_docs == 'true' }}

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      # `-count=1` because this job is the reason #1542 exists in miniature:
      # these tests read `docs/cli.md`, a file outside their own package, and
      # this step runs precisely when the docs changed and `cli/` may not have.
      # A cached pass keyed on `cli/go.sum` would be a parity check that never
      # looked at the page it is guarding.
      - name: CLI docs parity
        working-directory: cli
        run: go test -count=1 ./internal/cmd -run 'TestEveryCommandIsDocumented|TestNoDocumentedCommandIsInvented|TestGeneratedCLIReferenceIsCurrent'

  workflow-checks:
    name: CI policy and alert tests
    needs: changes
    # The classifier is intentionally skipped on push. Keep policy checks
    # running there and on classification failure; only explicit docs-only
    # output can skip the alert evaluator below.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Reject conflict markers
        run: python3 scripts/conflict-markers.py
      - name: Test CI decisions
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      # Alert rules, fixtures and executable tooling cannot enter the docs-only
      # plan. Keep their evaluator in the required job on every full plan,
      # including push and dispatch; the standalone workflow is not a gate.
      - name: Install the alert rule evaluator
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: sudo apt-get update && sudo apt-get install -y prometheus python3-yaml
      - name: Evaluate shipped alert fixtures
        if: ${{ needs.changes.outputs.docs_only != 'true' }}
        run: /usr/bin/python3 scripts/test-alerts.py

  gate:
    name: CI required
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - changes
      - workflow-checks
      - test
      - coverage
      - elixir-static
      - release-and-contract
      - cli
      - typescript-sdk
      - compose-fresh-clone
      - compose-pinned-image-boot
      - site
      - docs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false
      - name: Every required job passed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/gate.py
