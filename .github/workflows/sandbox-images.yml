# Checks the E2B sandbox image two ways, and builds nothing for production.
#
#   * `dockerfile` builds the reference recipe, images/e2b/, on the runner and
#     runs smoke.sh against it. That recipe is for self-hosters on hosted E2B
#     (scripts/sandbox-image/build-e2b.sh builds it there). It is not what
#     production runs.
#   * `e2b` smokes the template production actually boots: loam's `fountain`
#     template on loam's E2B-compatible API (E2B_BASE_URL). loam builds that
#     template from its own images/e2b-fountain/Containerfile
#     (https://github.com/arugula-salad/loam) and has no template build routes,
#     so a change to images/ here does not reach production; a change to the
#     production image is a change to loam.
#
# Until 2026-10-15 the `e2b` job rebuilt a template on hosted e2b.app that
# nothing in production used (ADR 0018, addendum of that date).
#
# Three triggers for the smoke:
#
#   * a push to main touching images/ or these scripts;
#   * a weekly cron, because production's template can break without a change
#     here;
#   * workflow_dispatch.
#
# Pull requests run the `dockerfile` job alone. It needs no provider account.
name: Sandbox images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/sandbox-image/**'
      - '.github/workflows/sandbox-images.yml'
  pull_request:
    paths:
      - 'images/**'
      - 'scripts/sandbox-image/**'
      - '.github/workflows/sandbox-images.yml'
  # Monday, early. The CLIs are what go stale; nothing else here changes on
  # its own.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
    inputs:
      smoke:
        description: Smoke production's E2B template after the local check (off runs the Dockerfile check alone)
        type: boolean
        default: true

permissions:
  contents: read

# Never cancel a run in flight: a cancelled smoke leaves its sandbox to the
# timeout instead of destroying it.
concurrency:
  group: sandbox-images
  cancel-in-progress: false

jobs:
  dockerfile:
    name: Build the reference e2b image locally and smoke it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # Nothing here runs an authenticated git operation, and the image
          # build should not inherit a push-capable credential.
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # amd64 only, and deliberately: E2B runs amd64, and this build exists to prove the reference recipe, not to publish anything.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/e2b
          file: images/e2b/e2b.Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: fountain-sandbox-e2b:ci

      # The same checks the live smokes run inside a real sandbox. Here they
      # answer a narrower question — is the image itself the shape provisioning
      # assumes — before the provider account is touched.
      - name: Smoke the image
        run: |
          docker run --rm \
            -e SMOKE_EXPECT_USER=sprite \
            -v "${PWD}/scripts/sandbox-image/smoke.sh:/tmp/smoke.sh:ro" \
            fountain-sandbox-e2b:ci \
            bash /tmp/smoke.sh

  e2b:
    name: Smoke production's E2B template
    needs: dockerfile
    # Pull requests stop at the dockerfile gate: a fork PR has no secrets, and
    # the smoke checks production's template, not the proposal.
    if: >-
      github.event_name != 'pull_request' &&
      github.event.inputs.smoke != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # A key of loam's `fountain-ci` project (Infisical `fountain`/prod,
      # /ci/E2B_LOAM_CI_API_KEY); the repository variables name loam's E2B
      # API and its `fountain` template. loam's templates belong to the
      # operator and every project sees them, so CI's sandboxes stay out of
      # production's project.
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
      E2B_BASE_URL: ${{ vars.E2B_BASE_URL || 'https://api.e2b.app' }}
      E2B_TEMPLATE: ${{ vars.E2B_TEMPLATE || 'fountain' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      # A missing secret fails the job. Skipping instead would be a green run
      # that checked nothing.
      - name: Require the E2B key
        run: |
          if [ -z "${E2B_API_KEY}" ]; then
            echo "::error::E2B_API_KEY is not configured."
            exit 1
          fi

      - name: Smoke the template
        run: scripts/sandbox-image/smoke-e2b.sh

      - name: Summary
        if: always()
        run: |
          echo "E2B template \`${E2B_TEMPLATE}\` on ${E2B_BASE_URL}: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
