# The documentation nav — the only copy.
#
# `Fountain.Docs` parses this file at compile time (via `Compiler.parse_nav/1`)
# and serves these pages at `/docs`. Adding, renaming or moving a page is a
# one-file change here.
#
# A line the parser cannot read RAISES at compile time rather than being
# skipped. A page silently missing from `/docs` is the failure being
# prevented, so keep to the two line shapes below: `  - Title: file.md` for a
# page, and a `  - Section:` header with six-space-indented children.
#
# **Sections are one level deep.** The in-app sidebar renders exactly a
# section and its pages, so a sub-section — or a page indented past its
# siblings — raises too. Flatten it into a sibling section, or make it
# headings on a hub page.
#
# Guardrails in `apps/fountain/test/fountain/docs_test.exs`: every page named
# here exists on disk, every page on disk is named here, and every internal
# `/docs` link and anchor resolves. `docs/cli.md` is diffed against the real
# CLI command tree by the Go suite.
#
# An installed extension may add pages and nav sections of its own
# (ADR 0043, #1510). They live in that app's `docs/` with its own nav.yml, and
# `Fountain.Manual` merges them in by section title — so this file names only
# the pages a CORE distribution serves, and a link from here to one of theirs
# would be a dead link on that distribution. The guardrails enforce it.
#
# Paths are relative to `docs/`.
