# :8080 unprivileged; /healthz for the k8s probes.
#
# Pages are written as `<path>.html` (`/built-with` -> built-with.html,
# `/docs/concepts/vault` -> docs/concepts/vault.html, `/` -> index.html), so
# try_files serves a clean URL without a redirect. Anything else is a 404 from
# nginx, but on managoat.com nothing else reaches here: Traefik sends only the
# site's paths to this service and the rest to the app (k8s/ingressroute.yaml).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Redirects carry a path, not a host: nginx only knows its own :8080, and
    # the first deploy sent a redirect to managoat.com:8080.
    absolute_redirect off;

    # The llms files, the skill and the search index are UTF-8 (em dashes, the
    # manual's arrows); without this a client guesses Latin-1.
    charset utf-8;
    charset_types text/plain text/markdown text/css application/json application/javascript;

    gzip on;
    gzip_types text/plain text/markdown text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Stylesheets carry a content hash in the name; the images do not and get
    # the app's old four-hour window instead.
    # Quoted: nginx reads an unquoted `{8}` as a block boundary and refuses
    # to start, which took the whole site down in the local image smoke test.
    location ~ "^/site/.*\.[0-9a-f]{8}\.css$" { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location /site/ { add_header Cache-Control "public, max-age=14400"; }

    # A trailing slash on a page is the same page; send it to the clean URL
    # rather than answering 404 (the app ignored trailing slashes too).
    location ~ ^/(.+)/$ { return 301 /$1; }

    # The skill, at the two paths the server served it on. Plain text, so a
    # `curl > SKILL.md` and a browser both get the file as written.
    location = /skill {
        default_type text/plain;
        add_header Cache-Control "no-cache";
        try_files /skill.txt =404;
    }
    location = /skills/fountain/SKILL.md {
        types { }
        default_type text/plain;
        add_header Cache-Control "no-cache";
    }

    # The manual. A page that does not exist gets the manual's own 404 page,
    # which is only ever served as an error (Traefik does not route /docs-404).
    location /docs/ {
        add_header Cache-Control "no-cache";
        error_page 404 /docs-404.html;
        try_files $uri $uri.html =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }
}
