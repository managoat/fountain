name: Release

# Builds the Go CLI under cli/, publishes the version-tagged server
# image, and attaches binaries to a GitHub Release. Triggered by
# pushing a v*.*.* tag, or manually via workflow_dispatch with an
# existing tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release as (must already exist on a commit)."
        required: true

env:
  GO_VERSION: "1.26.0"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            artifact: fountain-linux-amd64
            provider_artifact: buzz-backend-fountain-linux-amd64
          - goos: linux
            goarch: arm64
            artifact: fountain-linux-arm64
            provider_artifact: buzz-backend-fountain-linux-arm64
          - goos: darwin
            goarch: amd64
            artifact: fountain-darwin-amd64
            provider_artifact: buzz-backend-fountain-darwin-amd64
          - goos: darwin
            goarch: arm64
            artifact: fountain-darwin-arm64
            provider_artifact: buzz-backend-fountain-darwin-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: cli/go.sum

      # A release used to cross-compile without ever running the suite, so a
      # binary could ship with failing tests. Run once on the host platform —
      # cross-compiled test binaries cannot be executed here anyway.
      # `-count=1` for the same reason as ci.yml: a cached pass can outlive the
      # tree that earned it (#1542), and a release must not ship on one.
      - name: Test
        working-directory: cli
        run: go test -count=1 ./...

      # The Buzz provider is a second module and `go test ./...` above does not
      # reach it. Same reason as the step above: a release used to
      # cross-compile without running the suite.
      - name: Test the Buzz provider
        working-directory: apps/fountain_buzz/cli
        run: go test -count=1 ./...

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          # Stamped into the binary so `fountain --version` and the ACP
          # handshake's `agentInfo` report what someone actually installed.
          # A tag push gives GITHUB_REF_NAME; a manual dispatch names the tag.
          VERSION: ${{ inputs.tag || github.ref_name }}
        working-directory: cli
        run: |
          set -euxo pipefail
          mkdir -p ../dist
          go build -trimpath \
            -ldflags "-s -w -X github.com/managoat/fountain/cli/internal/cmd.Version=${VERSION}" \
            -o "../dist/${{ matrix.artifact }}" ./cmd/fountain
          file "../dist/${{ matrix.artifact }}"
          du -h "../dist/${{ matrix.artifact }}"

      # `buzz-backend-fountain` is the Buzz remote-agents provider. Buzz's
      # desktop discovers it by name on PATH, so it has to BE somewhere a
      # person can put on their PATH — and until #1508 it was built by nothing
      # and attached to no release, while docs/integrations/buzz.md and ADR
      # 0043 both described it as shipped. It is a separate module owned by
      # the extension, cross-compiled for the same four platforms as the
      # `fountain` binary beside it.
      #
      # No version stamp: the provider reports `protocol_version` (1) and its
      # own `version` string in the `info` op, which is what Buzz's desktop
      # checks. Neither is the Fountain release tag.
      - name: Build the Buzz provider
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        working-directory: apps/fountain_buzz/cli
        run: |
          set -euxo pipefail
          mkdir -p ../../../dist
          go build -trimpath -ldflags "-s -w" \
            -o "../../../dist/${{ matrix.provider_artifact }}" ./cmd/buzz-backend-fountain
          file "../../../dist/${{ matrix.provider_artifact }}"
          du -h "../../../dist/${{ matrix.provider_artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

      - name: Upload the Buzz provider
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.provider_artifact }}
          path: dist/${{ matrix.provider_artifact }}

  openapi:
    name: Export OpenAPI spec
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Same service + env shape as ci.yml's test job: the spec renders from
    # the compiled app, and app start is verified against this exact setup.
    services:
      postgres:
        image: postgres:16@sha256:287eced1f33b59ed265ed13a60d3680dd7646d70c4dc0e785f59a470ebc03eeb
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fountain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Set up Elixir
        id: beam
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.19.2"
          otp-version: "28.3"

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: deps
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Restore build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: _build
          key: ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
            ${{ runner.os }}-build-

      - name: Install dependencies
        run: mix deps.get

      # openapi.export boots the app, and since Oban arrived (#217) boot
      # requires the oban_jobs table — an unmigrated database aborts startup.
      - name: Set up database
        run: mix ecto.create --quiet && mix ecto.migrate --quiet

      # The same script CI runs, so the document attached to a tag is byte for
      # byte the one the SDK contract was built from — keys sorted, ordering
      # independent of the encoder (#1411). Without --check, because a tag is
      # not the place to discover a stale contract; CI already refused that.
      - name: Export spec
        run: scripts/sdk-contract/build.sh

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi.json
          path: dist/openapi.json

  image:
    # The server image is built fresh from the tag's tree rather than
    # re-tagging the sha- image build.yml pushes for the same commit. The
    # bump lands on main through a PR (#1329), so build.yml does build it,
    # but that build runs concurrently with this one and this workflow must
    # not wait on it or race it: the tag's tree, built here, is the release.
    #
    # Each architecture builds NATIVELY and pushes by digest; image-manifest
    # below stitches the digests into one multi-arch manifest and owns the
    # tags. This is build.yml's shape, and it is here for the same reason: a
    # single runner with QEMU spent 22.5 of a release's 23.1 minutes emulating
    # the arm64 Erlang compile. build.yml migrated off it and this job was
    # left behind, so the only slow build left in the repo was the one that
    # runs least often and blocks the release.
    name: Build versioned server image (${{ matrix.distribution }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        # Two distributions from one tree (ADR 0043 decision 7), each built
        # natively on both arches. The bundled one is what every existing tag
        # has meant and what the hosted deployment runs; the core one carries
        # no extension application and none of their native binaries, and is
        # the supported base for someone writing an extension of their own.
        #
        # Four builds rather than two, but four runners rather than two as
        # well: the release's wall clock is one native build, not the sum.
        distribution: [bundled, core]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            # Free for public repos; the cluster's own architecture.
            runner: ubuntu-24.04-arm
          - distribution: bundled
            bundle_extensions: "true"
            # The bundled image keeps the bare tags. A core image that had to
            # be asked for by name is the whole point of the default.
            suffix: ""
          - distribution: core
            bundle_extensions: "false"
            suffix: "-core"

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "${tag}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${tag}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "minor=${tag%.*}"
            echo "version=${tag#v}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The tag's commit, explicitly — a workflow_dispatch runs on the
          # ref it was dispatched from, which need not be the tag.
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Resolve build sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Read buzz-acp pin
        id: buzzver
        run: echo "version=$(tr -d '[:space:]' < apps/fountain_buzz/buzz-acp.version)" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        env:
          # v6 uploads a .dockerbuild build-record artifact by default. Nothing
          # consumes it, and its presence broke the release job, whose
          # download-all step failed on it after 5 retries — twice.
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BUILD_SHA=${{ steps.sha.outputs.sha }}
            BUZZ_ACP_VERSION=${{ steps.buzzver.outputs.version }}
            BUNDLE_EXTENSIONS=${{ matrix.bundle_extensions }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.sha.outputs.sha }}
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
          # Digest-only push; image-manifest owns the tags. Provenance off so
          # each push is exactly one image manifest — attestation manifests
          # would confuse the imagetools merge.
          outputs: type=image,name=ghcr.io/managoat/fountain,push-by-digest=true,name-canonical=true,push=true
          provenance: false
          # Read build.yml's cache, write nothing back. The layers above
          # `COPY mix.exs` hit; the deps.compile layer below it may not,
          # because the bump commit exists precisely to change the version
          # in mix.exs. build.yml owns that cache and is building the same
          # commit beside this run; a release must not overwrite the cache
          # every subsequent main build depends on.
          cache-from: type=registry,ref=ghcr.io/managoat/fountain:buildcache-${{ matrix.arch }}

      - name: Export digest
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          digest="${{ steps.build.outputs.digest }}"
          mkdir -p "${RUNNER_TEMP}/digests/${{ matrix.distribution }}"
          touch "${RUNNER_TEMP}/digests/${{ matrix.distribution }}/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest-${{ matrix.distribution }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/${{ matrix.distribution }}/*
          if-no-files-found: error
          retention-days: 1

  image-manifest:
    # Tags: vX.Y.Z is immutable; vX.Y moves to the newest patch in its line.
    # :latest continues to track main via build.yml and is not touched here.
    name: Publish versioned server image
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! echo "${tag}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${tag}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          {
            echo "tag=${tag}"
            echo "minor=${tag%.*}"
          } >> "$GITHUB_OUTPUT"

      # Deliberately NOT merge-multiple: each artifact lands in its own
      # directory named for the artifact, which is how the two distributions'
      # digests stay apart. Merged, four digests would arrive in one directory
      # and a manifest built from them would mix a core image into the bundled
      # tag — the failure this job's digest count exists to catch, arriving in
      # a form the count could not see.
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the manifest lists
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ghcr.io/managoat/fountain
          TAG: ${{ steps.tag.outputs.tag }}
          MINOR: ${{ steps.tag.outputs.minor }}
        run: |
          set -euo pipefail

          # One manifest list per distribution (ADR 0043 decision 7). The
          # bundled one keeps the bare tags, because that is what every
          # existing tag has meant and what every existing puller expects; the
          # core one is the same version with a `-core` suffix, so nobody has
          # to decide which product they are running.
          publish() {
            distribution="$1"
            suffix="$2"

            # One digest per arch, in per-arch directories. Anything else means
            # a build job pushed something unexpected, and a manifest built
            # from it would publish a release image nobody checked.
            refs=()
            for arch in amd64 arm64; do
              dir="image-digest-${distribution}-${arch}"
              if [ ! -d "$dir" ]; then
                echo "no digest artifact for ${distribution}/${arch}" >&2
                exit 1
              fi
              digests=("$dir"/*)
              if [ "${#digests[@]}" -ne 1 ]; then
                echo "expected 1 digest in ${dir}, found ${#digests[@]}" >&2
                exit 1
              fi
              refs+=("${IMAGE}@sha256:$(basename "${digests[0]}")")
            done

            docker buildx imagetools create \
              --tag "${IMAGE}:${TAG}${suffix}" \
              --tag "${IMAGE}:${MINOR}${suffix}" \
              "${refs[@]}"
            docker buildx imagetools inspect "${IMAGE}:${TAG}${suffix}"
          }

          publish bundled ""
          publish core "-core"

      # The published core image, opened. Every claim the campaign makes about
      # it is checked somewhere earlier — CI's core-distribution job builds the
      # release, and the Dockerfile refuses to bake a Buzz binary under
      # BUNDLE_EXTENSIONS=false — but nothing had looked inside the artifact a
      # person actually pulls. A build arg that stopped being passed would
      # publish a bundled image under the core tag and every one of those
      # earlier checks would still be green.
      - name: The published core image carries no extension
        env:
          IMAGE: ghcr.io/managoat/fountain
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          core="${IMAGE}:${TAG}-core"

          apps=$(docker run --rm --entrypoint sh "$core" -c 'ls /app/lib')
          echo "$apps" | tr '\n' ' '; echo
          if echo "$apps" | grep -qE '^fountain_'; then
            echo "::error::${core} contains an extension application" >&2
            echo "$apps" | grep -E '^fountain_' >&2
            exit 1
          fi

          binaries=$(docker run --rm --entrypoint sh "$core" \
            -c 'ls -A /usr/local/lib/fountain-buzz 2>/dev/null || true')
          if [ -n "$binaries" ]; then
            echo "::error::${core} carries native extension assets: ${binaries}" >&2
            exit 1
          fi

          # Guard the guard: an image whose /app/lib is empty would satisfy
          # both checks above. The server itself has to be in there.
          echo "$apps" | grep -qE '^fountain-[0-9]' || {
            echo "::error::${core} does not contain the fountain application" >&2
            exit 1
          }
          echo "${core}: no extension application, no native assets"

  compose-boot:
    # ci.yml's "Compose boots the pinned image" skips on the bump PR and on
    # the merged bump commit, because the pin names this image before it
    # exists (#1329). This is where that check runs instead: the tag's tree
    # pins the tag, the manifest job just published it, and the release
    # below waits for the answer. A tag whose image will not boot through
    # the documented quick start gets no release page telling self-hosters
    # to pin it.
    name: Compose boots the released image
    needs: image-manifest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: The tree pins the tag
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          pin="$(sed -nE 's/^FOUNTAIN_IMAGE_TAG=(v[0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .env.compose.example)"
          if [ "${pin}" != "${TAG}" ]; then
            echo ".env.compose.example pins ${pin}, but this is ${TAG}; the bump did not reach this tree" >&2
            exit 1
          fi

      - name: Run the documented quick start and probe the app
        run: scripts/compose-boot-check.sh

      - name: Dump container logs
        if: failure()
        run: docker compose logs --timestamps

  swift-package:
    name: Resolve the server tag's Swift package snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          persist-credentials: false

      - name: Set up Swift
        uses: swift-actions/setup-swift@7ca6abe6b3b0e8b5421b88be48feee39cbf52c6a # v2.4.0
        with:
          swift-version: "6.1"

      - name: Resolve and build a clean consumer
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if ! echo "${RELEASE_TAG}" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "'${RELEASE_TAG}' is not a vX.Y.Z tag" >&2
            exit 1
          fi
          version="${RELEASE_TAG#v}"
          if [ -f sdk/swift/version.json ]; then
            sdk_version="$(python3 -c 'import json; print(json.load(open("sdk/swift/version.json"))["version"])')"
          else
            sdk_version="$version" # Historical server-coupled package.
          fi
          consumer="${RUNNER_TEMP}/fountain-swift-consumer"
          mkdir -p "${consumer}/Sources/FountainReleaseSmoke"
          cat > "${consumer}/Package.swift" <<EOF
          // swift-tools-version: 6.1
          import PackageDescription

          let package = Package(
            name: "FountainReleaseSmoke",
            dependencies: [
              .package(
                url: "https://github.com/managoat/fountain.git",
                exact: "${version}"
              )
            ],
            targets: [
              .executableTarget(
                name: "FountainReleaseSmoke",
                dependencies: [
                  .product(name: "Fountain", package: "fountain")
                ]
              )
            ]
          )
          EOF
          cat > "${consumer}/Sources/FountainReleaseSmoke/main.swift" <<'EOF'
          import Fountain

          print(fountainSDKVersion)
          EOF
          cd "${consumer}"
          swift package resolve
          swift build
          resolved_version="$(swift run FountainReleaseSmoke)"
          if [ "${resolved_version}" != "${sdk_version}" ]; then
            echo "remote package reports ${resolved_version}, expected ${sdk_version}" >&2
            exit 1
          fi

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # image-manifest is a needs so a release is never published without its
    # image — the release page is what tells a self-hoster the tag exists to
    # pin. Depending on the manifest job rather than the per-arch builds: two
    # pushed digests with no manifest list on the tag is not a published image.
    # compose-boot goes one further: the image also has to boot through the
    # quick start the release page points at.
    needs: [build, openapi, image-manifest, compose-boot, swift-package]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      # Only the artifacts the release ships, by name — never download-all.
      # Jobs in this run upload artifacts we do not attach (the image job's
      # docker build record, for one), and an undownloadable stray must not
      # block the release.
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: "{fountain-*,buzz-backend-fountain-*,openapi.json}"

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            artifacts/fountain-linux-amd64/fountain-linux-amd64
            artifacts/fountain-linux-arm64/fountain-linux-arm64
            artifacts/fountain-darwin-amd64/fountain-darwin-amd64
            artifacts/fountain-darwin-arm64/fountain-darwin-arm64
            artifacts/buzz-backend-fountain-linux-amd64/buzz-backend-fountain-linux-amd64
            artifacts/buzz-backend-fountain-linux-arm64/buzz-backend-fountain-linux-arm64
            artifacts/buzz-backend-fountain-darwin-amd64/buzz-backend-fountain-darwin-amd64
            artifacts/buzz-backend-fountain-darwin-arm64/buzz-backend-fountain-darwin-arm64
            artifacts/openapi.json/openapi.json
          fail_on_unmatched_files: true

  bump-tap:
    name: Bump Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release

    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ github.event.inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # By name, for the reason the release job above states: this run also
      # uploads artifacts the tap does not want (the per-arch image digests),
      # and a download-all is one stray artifact away from failing a step
      # that only ever needed the four binaries.
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          pattern: fountain-*

      - name: Compute SHA256s
        id: sha
        run: |
          set -euo pipefail
          for a in fountain-darwin-amd64 fountain-darwin-arm64 fountain-linux-amd64 fountain-linux-arm64; do
            sum=$(sha256sum "artifacts/${a}/${a}" | awk '{print $1}')
            key=$(echo "${a#fountain-}" | tr - _)
            echo "${key}=${sum}" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout tap repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: managoat/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Write formula
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          SHA_DARWIN_ARM64: ${{ steps.sha.outputs.darwin_arm64 }}
          SHA_DARWIN_AMD64: ${{ steps.sha.outputs.darwin_amd64 }}
          SHA_LINUX_ARM64: ${{ steps.sha.outputs.linux_arm64 }}
          SHA_LINUX_AMD64: ${{ steps.sha.outputs.linux_amd64 }}
        run: |
          cat > tap/Formula/fountain.rb <<EOF
          class Fountain < Formula
            desc "CLI for Fountain — HTTP/JSON client, SSE consumer, and secret-store helper"
            homepage "https://github.com/managoat/fountain"
            version "${VERSION}"
            license "MIT"

            on_macos do
              on_arm do
                url "https://github.com/managoat/fountain/releases/download/${TAG}/fountain-darwin-arm64"
                sha256 "${SHA_DARWIN_ARM64}"
              end
              on_intel do
                url "https://github.com/managoat/fountain/releases/download/${TAG}/fountain-darwin-amd64"
                sha256 "${SHA_DARWIN_AMD64}"
              end
            end

            on_linux do
              on_arm do
                url "https://github.com/managoat/fountain/releases/download/${TAG}/fountain-linux-arm64"
                sha256 "${SHA_LINUX_ARM64}"
              end
              on_intel do
                url "https://github.com/managoat/fountain/releases/download/${TAG}/fountain-linux-amd64"
                sha256 "${SHA_LINUX_AMD64}"
              end
            end

            def install
              arch = Hardware::CPU.arm? ? "arm64" : "amd64"
              os = OS.mac? ? "darwin" : "linux"
              bin.install "fountain-#{os}-#{arch}" => "fountain"
            end

            test do
              assert_match "fountain", shell_output("#{bin}/fountain --help")
            end
          end
          EOF

      - name: Commit and push
        working-directory: tap
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "fountain-release-bot"
          git config user.email "noreply@github.com"
          if git diff --quiet -- Formula/fountain.rb; then
            echo "Formula already up to date for ${TAG}; nothing to commit."
            exit 0
          fi
          git add Formula/fountain.rb
          git commit -m "fountain ${TAG}"
          git push
