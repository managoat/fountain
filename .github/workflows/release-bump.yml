name: Release bump

# Cuts a release in one run (ADR 0078). "Run workflow" (Actions tab →
# "Release bump"; defaults to `patch`) on main:
#
# 1. refuses unless CI passed on main's tip, the commit being released;
# 2. runs the live adapter suite (live-adapters.yml) on that commit, the
#    gate for the ACP peer and the runtimes, and refuses unless it passes;
# 3. bumps the version in both mix.exs files and the five self-host image
#    pins, in one commit on top of it;
# 4. pushes that commit to main and the `vX.Y.Z` tag on it, atomically.
#
# The gate tests main's tip, the commit the bump is made on, rather than
# the bump commit itself: the bump changes only version strings and image
# pins, which the suite does not read, and testing before committing means
# a failed gate leaves nothing to undo. The release job checks out that
# same commit, so what is tagged is what was tested plus the bump; if main
# has moved on meanwhile, the atomic push is refused and nothing ships.
#
# `dry_run` runs steps 1 and 2 and the bump without pushing, from any
# branch's copy of this workflow, against main's tip: how a change to this
# workflow or the gate is tried without releasing.
#
# The tag push fires release.yml, which builds the CLI binaries, publishes
# the versioned image, boots it through the documented quick start and
# creates the GitHub Release with notes generated from the merged pull
# requests. When that run succeeds, publish-manifests.yml publishes the
# tag's deploy/ as the `vX.Y.Z` manifest artifact and moves `latest` to it,
# which is what deploys prod (decisions/0080). The main push runs CI and
# build.yml like any other commit on main; ci.yml's compose boot check
# defers to release.yml because the pinned image does not exist until the
# release publishes it.
#
# The push uses RELEASE_BUMP_TOKEN, not GITHUB_TOKEN, for two reasons. The
# Main Protection ruleset rejects a direct push to main from anyone off its
# bypass list ("Changes must be made through a pull request", #1329). And a
# tag or commit pushed with GITHUB_TOKEN triggers no workflows, so
# release.yml and main's CI would never start. The token is a personal
# access token of an organization admin (the ruleset's bypass list): a
# classic PAT with `repo`, or a fine-grained one with Contents read/write on
# this repository.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Which segment to bump"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: "Check CI, run the live adapter gate and bump, but push nothing"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-bump
  cancel-in-progress: false

jobs:
  # The commit being released, fixed once so the gate and the release see
  # the same one, and main's CI result for it.
  commit:
    name: CI passed on the commit being released
    if: ${{ github.ref == 'refs/heads/main' || inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      # Read main's CI result for the commit being released.
      actions: read

    outputs:
      sha: ${{ steps.main.outputs.sha }}

    steps:
      - name: CI passed on main's tip
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)"
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${sha}" \
            --event push --status success --json databaseId --jq 'length')"
          if [ "${passed}" = "0" ]; then
            echo "CI has not passed on main's tip ${sha:0:7}; release once it is green." >&2
            exit 1
          fi
          echo "CI passed on ${sha:0:7}"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

  live-adapters:
    name: Live adapter gate
    needs: commit
    uses: ./.github/workflows/live-adapters.yml
    with:
      ref: ${{ needs.commit.outputs.sha }}
    secrets: inherit

  # A gate that failed skips the release job without a word of its own; say
  # why nothing was tagged.
  gate-failed:
    name: Live adapter gate failed
    needs: [commit, live-adapters]
    if: ${{ failure() && needs.live-adapters.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Stop the release
        env:
          SHA: ${{ needs.commit.outputs.sha }}
        run: |
          echo "::error::The live adapter gate failed on ${SHA:0:7}; nothing was bumped, tagged or pushed. See the Live adapter gate job, fix main, and run Release bump again."
          exit 1

  release:
    name: Bump, tag and push the release
    needs: [commit, live-adapters]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: read
      # Read main's CI result for the commit being released.
      actions: read

    steps:
      - name: Require RELEASE_BUMP_TOKEN
        if: ${{ !inputs.dry_run }}
        env:
          TOKEN: ${{ secrets.RELEASE_BUMP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ]; then
            echo "RELEASE_BUMP_TOKEN is not set." >&2
            echo "Add a maintainer's PAT that may push to main as that secret (see this workflow's header)." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          # The commit the gate passed, not whatever main is now.
          ref: ${{ needs.commit.outputs.sha }}
          # Full history so the tag check below sees what exists.
          fetch-depth: 0
          token: ${{ inputs.dry_run && github.token || secrets.RELEASE_BUMP_TOKEN }}

      - name: CI passed on the commit being released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          passed="$(gh run list --repo "${GITHUB_REPOSITORY}" --workflow ci.yml --commit "${sha}" \
            --event push --status success --json databaseId --jq 'length')"
          if [ "${passed}" = "0" ]; then
            echo "CI has not passed on main's tip ${sha:0:7}; release once it is green." >&2
            exit 1
          fi
          echo "CI passed on ${sha:0:7}"

      - name: Compute next version
        id: ver
        run: |
          set -euo pipefail
          current=$(grep -oE 'version: "[0-9]+\.[0-9]+\.[0-9]+"' mix.exs \
            | head -1 \
            | sed -E 's/version: "([0-9]+\.[0-9]+\.[0-9]+)"/\1/')
          echo "current=$current"
          IFS='.' read -r major minor patch <<<"$current"
          case "${{ inputs.bump }}" in
            patch) patch=$((patch + 1)) ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            major) major=$((major + 1)); minor=0; patch=0 ;;
            *) echo "unknown bump: ${{ inputs.bump }}" >&2; exit 1 ;;
          esac
          next="${major}.${minor}.${patch}"
          tag="v${next}"
          echo "next=$next"
          {
            echo "next=$next"
            echo "tag=$tag"
            echo "current=$current"
          } >> "$GITHUB_OUTPUT"
          if git rev-parse "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "tag ${tag} already exists" >&2
            exit 1
          fi

      - name: Update server versions
        run: |
          set -euo pipefail
          current='${{ steps.ver.outputs.current }}'
          next='${{ steps.ver.outputs.next }}'
          sed -i -E "s/version: \"${current}\"/version: \"${next}\"/" mix.exs
          sed -i -E "s/version: \"${current}\"/version: \"${next}\"/" apps/fountain/mix.exs
          git diff --stat

      - name: Update self-host image pins
        run: |
          set -euo pipefail
          current='v${{ steps.ver.outputs.current }}'
          next='${{ steps.ver.outputs.tag }}'
          # The quick-start pins sat at v0.3.0 through two releases, handing
          # newcomers an image from before the in-app first-login flow
          # (#478). Bump them in the release commit so the tag's own tree
          # pins the tag. ReleasePinTest keeps this list and the files in
          # lockstep between releases.
          pins='docker-compose.yml .env.compose.example fly.toml deploy/k8s/kustomization.yaml deploy/k8s/deployment.yaml'
          for f in ${pins}; do
            sed -i "s/${current}/${next}/g" "$f"
            # sed exits 0 whether or not it matched; a pin that no longer
            # matches ${current} must abort the release, not ship stale.
            if ! grep -qF "${next}" "$f" || grep -qF "${current}" "$f"; then
              echo "pin bump failed in ${f}: expected ${current} -> ${next}" >&2
              exit 1
            fi
          done
          git diff --stat

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mix.exs apps/fountain/mix.exs \
            docker-compose.yml .env.compose.example fly.toml \
            deploy/k8s/kustomization.yaml deploy/k8s/deployment.yaml
          git commit -m "chore(release): ${TAG}"
          git tag -a "${TAG}" -m "Release ${TAG}"
          # Atomic: main and the tag move together or not at all. A main that
          # moved since the checkout rejects the push; run the workflow again.
          git push --atomic origin HEAD:refs/heads/main "refs/tags/${TAG}"
          echo "Pushed ${TAG}; release.yml runs on the tag."

      - name: Dry run
        if: ${{ inputs.dry_run }}
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git diff --stat
          echo "Dry run: CI and the live adapter gate passed on $(git rev-parse --short HEAD); would have committed, tagged and pushed ${TAG}."
