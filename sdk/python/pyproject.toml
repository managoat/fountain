[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fountain-agent-sdk"
version = "0.2.1"
description = "Run coding agents on Fountain, with real computers, repositories, and credentials."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Binary Bourbon" }]
keywords = ["fountain", "agent", "sandbox", "coding-agent", "acp", "sdk"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/managoat/fountain/tree/main/sdk/python"
Repository = "https://github.com/managoat/fountain.git"
Documentation = "https://managoat.com/docs/python-sdk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fountain = ["py.typed"]
