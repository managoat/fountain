apiVersion: v1
kind: Service
metadata:
  name: fountain
  labels:
    app: fountain
spec:
  selector:
    app: fountain
  ports:
    - name: http
      port: 80
      targetPort: http
    # The egress broker. Point a TCP route at it; see configmap.yaml.
    - name: broker
      port: 14322
      targetPort: broker
