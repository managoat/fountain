name: site

# The managoat.com pages in site/: a Mix project of its own that renders static
# HTML, served by nginx from ghcr.io/managoat/site (ADR 0034, amended
# 2026-10-15 when the pages came back from managoat/site). Ported from that
# repo's ci.yml and build.yml.
#
# Pull requests: test and render the site whenever site/ changes, and also
# when docs/ does, because the site's link test checks every /docs link
# against docs/nav.yml and the pages on disk. ci.yml's classifier puts a
# site-only diff on its short path, so a headline edit runs this and not the
# server suite.
#
# main: test and render again, build the image for both architectures, and
# publish what Flux deploys. That is an OCI artifact,
# ghcr.io/managoat/site-manifests, holding site/k8s with the image built from
# this commit pinned into deployment.yaml: the same shape publish-manifests.yml
# uses for the app. The site repo committed the pin back to its own main
# instead; this repository's ruleset refuses a GITHUB_TOKEN push to main, and
# an artifact needs no commit at all. A docs-only push to main builds nothing:
# the PR that made it already ran the link check, and the pages did not move.
on:
  pull_request:
    paths:
      - "site/**"
      - "docs/**"
      - ".tool-versions"
      - ".github/workflows/site.yml"
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".tool-versions"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  # PR updates supersede one another; main commits each build and publish.
  group: site-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/managoat/site
  MANIFESTS: ghcr.io/managoat/site-manifests

jobs:
  test:
    name: Site test and render
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      # The repo's one toolchain pin. The site kept its own .tool-versions
      # while it was a separate repo; it named the same versions.
      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Restore deps and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            site/deps
            site/_build
          key: ${{ runner.os }}-site-mix-${{ hashFiles('.tool-versions', 'site/mix.lock') }}

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # Includes the link check: every same-host link lands on a page, an
      # asset, or a page of docs/nav.yml.
      - run: mix test
      - run: mix site.build

      # The config nginx will actually load, tested by nginx: a directive it
      # rejects is a container that never starts.
      - name: nginx accepts the config
        run: docker run --rm -v "$PWD/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

      - name: The manifests build
        run: kubectl kustomize k8s > /dev/null

      - name: Keep the render for the image
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 1

  image:
    name: Build the site image
    needs: test
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          persist-credentials: false

      - name: Fetch the render
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-dist
          path: site/dist

      # The Dockerfile only copies files into nginx:alpine, so both
      # architectures build on one runner with no emulation.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # The `site` package was created by managoat/site, so this repository
      # needs Write under the package's "Manage Actions access" to push here.
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: site
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish the site manifests
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # One publish at a time, never cancelled: the guard below decides order.
    concurrency:
      group: site-publish
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          # Full history: the backwards-move guard walks ancestry.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flux CLI
        uses: fluxcd/flux2/action@b9c17924adb533d3617ec7de97a7b0f4acc07b39 # v2.9.6
        with:
          # Matches the cluster's source-controller, as publish-manifests.yml.
          version: 2.8.7

      - name: Stage site/k8s with the image pinned
        id: stage
        run: |
          set -euo pipefail
          staging="$(mktemp -d)"
          cp -R site/k8s "${staging}/k8s"
          # The committed pin is whatever was live when it was last edited;
          # the artifact carries this commit's image. Exactly one image line,
          # or the publish stops: a stale pin must never ship silently.
          f="${staging}/k8s/deployment.yaml"
          n=$(grep -cE "^\s*image: ${IMAGE}:" "$f")
          [ "$n" = 1 ] || { echo "expected one ${IMAGE} image in $f, found $n" >&2; exit 1; }
          sed -i -E "s#^(\s*image: ${IMAGE}:).*#\1sha-${GITHUB_SHA}#" "$f"
          kubectl kustomize "${staging}/k8s" | grep -q "image: ${IMAGE}:sha-${GITHUB_SHA}" \
            || { echo "staged tree does not carry the sha pin" >&2; exit 1; }
          echo "dir=${staging}" >> "$GITHUB_OUTPUT"

      - name: Publish the artifact
        env:
          STAGING: ${{ steps.stage.outputs.dir }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          # Refuse to move `latest` backwards: an older commit's run that
          # finishes late must not replace a newer deploy.
          previous=$(docker buildx imagetools inspect --raw "${MANIFESTS}:latest" 2>/dev/null \
            | jq -r '.annotations["org.opencontainers.image.revision"] // empty' || true)
          if [ -n "${previous}" ] && [ "${previous}" != "${GITHUB_SHA}" ] \
             && git merge-base --is-ancestor "${GITHUB_SHA}" "${previous}" 2>/dev/null; then
            echo "${GITHUB_SHA::7} is an ancestor of the published ${previous::7}; not moving latest."
            exit 0
          fi

          flux push artifact "oci://${MANIFESTS}:sha-${GITHUB_SHA::7}" \
            --path="${STAGING}" \
            --source="https://github.com/${{ github.repository }}" \
            --revision="${GITHUB_SHA}"
          flux tag artifact "oci://${MANIFESTS}:sha-${GITHUB_SHA::7}" --tag latest
          echo "published ${MANIFESTS}:sha-${GITHUB_SHA::7}, latest re-tagged"

      - name: Nudge Flux
        # Best-effort, as in publish-manifests.yml: the 5-minute poll is the
        # fallback. The receiver behind this URL reconciles the site only once
        # home-cloud lists the managoat-site OCIRepository among its resources.
        env:
          FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
        run: |
          if [ -z "${FLUX_WEBHOOK_URL}" ]; then
            echo "FLUX_WEBHOOK_URL not set; relying on the poll interval."
            exit 0
          fi
          curl -fsS -m 10 -X POST "${FLUX_WEBHOOK_URL}" > /dev/null \
            && echo "flux nudged" || echo "webhook ping failed; the poll will pick it up"
